<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b70">
<meta name="description" content="今日学习工作台：一句话把今天的英语启蒙说出来。">
<title>今日学习工作台</title>
<link rel="icon" href="data:,">
<style>
:root {
  --ink: #171c38; --muted: #7c82a1; --muted-2: #898eaa;
  --brand: #5b53d3; --brand-deep: #4f46cf; --brand-mid: #7564e4; --brand-light: #9780ef;
  --brand-soft: #efeeff; --brand-border: #cfccf8;
  --green: #16815b; --green-soft: #e8f8f1; --green-border: #bce8d5;
  --yellow: #f5c451; --yellow-soft: #fff7dc;
  --line: #e2e4ef; --canvas: #f7f8fc; --card: #ffffff;
  --shadow-sm: 0 7px 20px #1f26510b; --shadow-md: 0 12px 28px #4c41be1a; --shadow-lg: 0 16px 34px #4f46e538;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button { cursor: pointer; }

/* ===== 手机外框（桌面时居中显示，手机时全屏） ===== */
.app-stage { min-height: 100dvh; display: grid; place-items: start center; padding: 0; }
.app-phone { width: 100%; max-width: 480px; min-height: 100dvh; background: var(--canvas); position: relative; box-shadow: 0 0 0 1px var(--line), 0 18px 50px #1f26511f; }
@media (min-width: 560px) {
  .app-stage { padding: 28px 16px 40px; }
  .app-phone { min-height: 0; border-radius: 34px; overflow: visible; box-shadow: 0 24px 70px #1f265126, 0 0 0 1px var(--line); }
}

/* ===== Tab 视图切换（核心） ===== */
.tab-view { display: none; }
.tab-view.active { display: block; }

/* ===== 顶栏 ===== */
.topbar { position: sticky; top: 0; z-index: 30; background: #fffffffa; backdrop-filter: blur(10px); border-bottom: 1px solid #eceef5; }
.topbar-inner { max-width: 480px; margin: 0 auto; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(145deg, #4d45cc, #7566e3); color: #fff; font-weight: 900; font-size: 12px; box-shadow: 0 6px 14px #2c248c1f; }
.brand-copy strong { display: block; font-size: 16.5px; color: var(--ink); }
.brand-copy small { display: block; margin-top: 2px; color: var(--muted-2); font-size: 11.5px; }
.site-link { flex: none; padding: 9px 13px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: #554dca; font-size: 12.5px; font-weight: 800; text-decoration: none; box-shadow: 0 5px 14px #221b8316; }
.site-link:hover { background: #fff; box-shadow: 0 8px 18px #221b8326; }

/* ===== 页面容器 ===== */
.page { max-width: 480px; margin: 0 auto; padding: 18px 16px 108px; }

/* ===== Hero（渐变紫） ===== */
.hero { position: relative; overflow: hidden; padding: 22px 22px 26px; border-radius: 22px; background: linear-gradient(140deg, #4f46cf, #7564e4 60%, #9780ef); color: #fff; box-shadow: var(--shadow-lg); }
.hero-kicker { margin: 0; color: #dcd9ff; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; }
.hero h1 { margin: 7px 0 8px; font-size: 24px; line-height: 1.22; }
.hero-desc { margin: 0; color: #dedcff; font-size: 12.5px; line-height: 1.65; }
.hero-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
.hero-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: #ffffff3d; }
.hero-progress i { display: block; width: 0; height: 100%; background: #fff; transition: width .3s ease; }

/* ===== 按钮 ===== */
.button { min-height: 42px; border: 1px solid transparent; border-radius: 14px; padding: 10px 16px; background: var(--yellow); color: #3e310e; font-weight: 900; font-size: 13.5px; display: inline-flex; align-items: center; text-decoration: none; box-shadow: 0 6px 16px #f5c45152; }
.button:hover { filter: brightness(1.04); }
.button.secondary { border: 1px solid #ffffff59; background: #ffffff1f; color: #fff; box-shadow: none; }
.result-note { margin: 0 0 10px; color: var(--muted-2); font-size: 11.5px; }

/* ===== 统计卡 ===== */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 14px 0 20px; }
.stat { padding: 14px 15px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-sm); }
.stat span { display: block; color: var(--muted-2); font-size: 11px; }
.stat strong { display: block; margin-top: 4px; font-size: 20px; color: var(--brand); }
.stat small { display: block; margin-top: 3px; color: var(--muted-2); font-size: 10.5px; }

/* ===== 模块 ===== */
.module { margin-bottom: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 19px; overflow: hidden; box-shadow: var(--shadow-sm); }
.module.open { border-color: var(--brand-border); box-shadow: var(--shadow-md); }
.module-head { padding: 14px 16px; border-bottom: 1px solid #eceef5; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.module-head h2 { margin: 0; font-size: 15.5px; }
.module-head span { color: var(--muted-2); font-size: 11.5px; }
.module-body { padding: 15px 16px; }

/* ===== 步骤 ===== */
.steps { display: grid; gap: 9px; }
.step { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px 14px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
.step.done { border-color: var(--green-border); background: var(--green-soft); }
.step-num { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; background: var(--brand-soft); color: #5850d0; font-weight: 900; font-size: 13px; }
.step.done .step-num { background: var(--green); color: #fff; }
.step-title { display: block; font-size: 14.5px; font-weight: 800; }
.step-title small { display: inline-block; margin-left: 7px; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: #5850d0; font-size: 10.5px; }
.step-desc { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.step-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tiny-action { min-height: 34px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: var(--muted-2); font-weight: 800; font-size: 12px; box-shadow: 0 3px 8px #3f369112; }
.tiny-action:hover { border-color: var(--brand-border); }
.tiny-action.done { background: var(--green); border-color: var(--green); color: #fff; }

/* ===== 闪卡 / 卡片网格 ===== */
.flashcards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 380px) { .flashcards { grid-template-columns: 1fr; } .card-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; } }
.flashcard, .card-tile { position: relative; border: 1px solid var(--line); border-radius: 16px; background: #fff; overflow: hidden; text-align: left; padding: 0; box-shadow: var(--shadow-sm); }
.flashcard img { display: block; width: 100%; height: 120px; object-fit: cover; background: #eef0f7; }
.card-tile img { display: block; width: 100%; aspect-ratio: 1 / 1; height: auto; object-fit: cover; background: #eef0f7; margin: 0; padding: 0; border: 0; }
.card-stage { display: inline-flex; align-items: center; justify-content: center; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 11px; font-weight: 800; cursor: pointer; }
.card-stage.learned { background: var(--yellow-soft); border-color: #f0dfa8; color: #8a6d1c; }
.card-stage.output { background: var(--green-soft); border-color: var(--green-border); color: var(--green); }
.card-tile .card-body { padding: 6px 8px 8px; display: flex; align-items: center; }
.card-tile .card-body:empty { display: none; }
.card-tile img.speaking-img { height: auto; aspect-ratio: 595 / 842; object-fit: contain; background: #f2f3f7; }
.card-tile img.speaking-advanced-img { height: auto; aspect-ratio: 2.05 / 1; object-fit: contain; background: #f2f3f7; }
.flashcard.checked, .card-tile.checked { border-color: var(--green-border); background: var(--green-soft); }
.flashcard.checked::after { content: "✓"; position: absolute; right: 8px; top: 8px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 900; }
.flashcard-body { padding: 10px 12px 12px; }
.card-tile .card-body { padding: 7px 8px 9px; }
.flashcard-body small, .card-tile .card-body small { display: block; color: var(--muted-2); font-size: 9.5px; }
.flashcard-body strong, .card-tile .card-body strong { display: block; margin-top: 2px; font-size: 12.5px; }
.flashcard-body em, .card-tile .card-body em { display: block; margin-top: 2px; color: var(--muted-2); font-style: normal; font-size: 10.5px; }
.card-no { position: absolute; left: 6px; top: 6px; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; border-radius: 999px; background: rgba(255,255,255,.9); border: 1px solid #5b53d3; color: #5b53d3; font-size: 9.5px; font-weight: 800; box-sizing: border-box; }

/* ===== 游戏 ===== */
.game-list { display: grid; gap: 10px; }
.game-card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; }
.game-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: #f7f8fc; border-bottom: 1px solid #eceef5; }
.game-card-head h3 { margin: 0; font-size: 13.5px; }
.game-card-head small { color: var(--muted-2); font-size: 10.5px; }
.game-card-body { padding: 12px 14px; }
.game-card .game-card-head { min-width: 0; }
.game-card .game-card-head h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-card .game-card-head small span:first-child { white-space: nowrap; }
.game-card-body p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
.game-props { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.game-props span { padding: 4px 9px; border-radius: 999px; background: var(--brand-soft); color: #5850d0; font-size: 11px; font-weight: 700; }
.dialogue { display: grid; gap: 6px; }
.dialogue div { padding: 8px 10px; border-radius: 10px; background: #f2f3f7; font-size: 12px; line-height: 1.55; }
.dialogue div.mom { background: var(--brand-soft); }
.dialogue div.kid { background: var(--yellow-soft); }
.dialogue b { margin-right: 6px; color: var(--brand-deep); font-size: 11px; }

/* ===== 句型 ===== */
.sentence-box { padding: 14px 16px; border-radius: 16px; background: linear-gradient(140deg, #4f46cf, #7564e4 70%, #9780ef); color: #fff; box-shadow: var(--shadow-md); }
.sentence-box strong { display: block; font-size: 19px; line-height: 1.3; }
.sentence-box p { margin: 6px 0 0; color: #dcd9ff; font-size: 12px; }
.qa-list { display: grid; gap: 9px; }
.qa-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.qa-item .pattern-label { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--brand-soft); color: #5b53d3; font-size: 11px; font-weight: 800; }
.qa-item h3 { margin: 7px 0 5px; font-size: 14.5px; }
.qa-item .qa-line { display: flex; gap: 8px; align-items: baseline; margin-top: 5px; }
.qa-item .qa-line b { color: var(--brand); font-size: 11.5px; min-width: 18px; }
.qa-item .qa-line span { font-size: 13px; line-height: 1.5; }
.qa-item .zh { margin: 5px 0 0; color: var(--muted); font-size: 11.5px; }

/* ===== 儿歌列表 ===== */
.song-list { display: grid; gap: 8px; }
.song-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.song-item.done { border-color: var(--green-border); background: var(--green-soft); }
.song-item strong { font-size: 13.5px; }
.song-item small { display: block; color: var(--muted-2); font-size: 11px; }
.status { padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800; }
.status.pending { background: var(--yellow-soft); color: #8a5a12; }
.status.done { background: var(--green-soft); color: var(--green); }
.status-badge { padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800; }
.status-badge.pending { background: var(--yellow-soft); color: #8a5a12; }
.status-badge.done { background: var(--green-soft); color: var(--green); }

/* ===== 卡库筛选 Hero（参考"北京必游榜"样式） ===== */
.filter-hero { padding: 16px 14px 13px; border-radius: 22px 22px 26px 26px; margin-bottom: 14px; color: #fff; background: linear-gradient(140deg, #4f46cf, #7564e4 58%, #9780ef); box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
.filter-hero::before { content: ""; position: absolute; left: -30px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: #ffffff17; pointer-events: none; }
.filter-hero::after { content: ""; position: absolute; right: -40px; top: 30%; width: 180px; height: 180px; border-radius: 50%; background: #ffffff0d; pointer-events: none; }
.filter-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; position: relative; z-index: 2; }
.filter-hero-title { font-size: 19px; font-weight: 900; letter-spacing: .02em; }
.filter-hero-badge { padding: 6px 12px; border-radius: 999px; background: #ffffff1f; font-size: 11px; font-weight: 800; color: #fff; }
.filter-line { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; position: relative; z-index: 2; }
.filter-line::-webkit-scrollbar { display: none; }
.filter-line button { flex: none; min-height: 32px; padding: 6px 14px; border: 0; border-radius: 999px; background: #ffffff21; color: #eae7ff; font-size: 12.5px; font-weight: 700; }
.filter-line button.active { background: #fff; color: #4f46cf; box-shadow: 0 4px 12px #1f26512e; }
.filter-line-main { margin-bottom: 9px; }
.filter-line-main button { font-size: 13px; font-weight: 800; }
.filter-line-sub { margin-bottom: 9px; }
.filter-line-cats button { background: #ffffff14; font-size: 12px; }

/* ===== 分类筛选 ===== */
.card-seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.card-seg button { padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font-size: 12px; font-weight: 700; }
.card-seg button.active { background: linear-gradient(145deg, #4d45cc, #7566e3); border-color: transparent; color: #fff; box-shadow: 0 4px 12px #4f46e52e; }
.card-seg button:hover { border-color: var(--brand-border); color: var(--brand); }
.card-seg button.active:hover { color: #fff; }

/* ===== 儿歌 ===== */
.rhyme-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 18px 20px 46px; border-radius: 20px; background: linear-gradient(140deg, #4f46cf, #7564e4 65%, #9780ef); color: #fff; box-shadow: var(--shadow-lg); position: relative; }
.rhyme-hero-actions { justify-content: flex-end; }
.rhyme-hero span { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; color: #dcd9ff; }
.rhyme-hero strong { display: block; margin-top: 4px; font-size: 20px; }
.rhyme-hero p { margin: 5px 0 0; color: #dedcff; font-size: 12px; line-height: 1.55; }
.rhyme-hero-bottombar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 8px 20px 10px; background: #ffffff14; }
.rhyme-hero-bar { flex: 1; height: 6px; border-radius: 999px; background: #ffffff3d; overflow: hidden; }
.rhyme-hero-bar i { display: block; height: 100%; border-radius: 999px; background: #fff; transition: width .3s ease; }
.rhyme-hero-progress-text { flex: none; color: #dedcff; font-size: 11.5px; font-weight: 800; }
.rhyme-hero-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.rhyme-hero-actions button { padding: 8px 15px; border: 1px solid #ffffff59; border-radius: 999px; background: #ffffff1f; color: #fff; font-size: 12.5px; font-weight: 800; cursor: pointer; }
.rhyme-hero-actions button.on { background: #fff; border-color: #fff; color: var(--brand); }
#rhyme-playall-button { padding: 9px 16px; border: 0; border-radius: 999px; background: linear-gradient(145deg, #4d45cc, #7566e3); color: #fff; font-size: 12.5px; font-weight: 800; box-shadow: 0 6px 16px #2c248c26; }
#rhyme-playall-button.on { background: linear-gradient(145deg, #16815b, #1ea06f); }
.rhyme-global-player { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 45; width: 100%; max-width: 452px; display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: #fffffffb; backdrop-filter: blur(12px); border: 1px solid #e6e8f4; border-radius: 18px; box-shadow: 0 14px 34px #1f26511f; }
.rhyme-global-player[hidden] { display: none; }
#rhyme-global-stop { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: linear-gradient(145deg, #16815b, #1ea06f); color: #fff; font-size: 14px; display: grid; place-items: center; box-shadow: 0 6px 14px #16815b3d; }
.rhyme-global-skip { flex: none; width: 32px; height: 32px; border: 1px solid var(--brand-border); border-radius: 50%; background: #fff; color: var(--brand); font-size: 12px; display: grid; place-items: center; }
.rhyme-global-copy { min-width: 0; display: grid; gap: 2px; }
.rhyme-global-copy b { font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rhyme-global-copy small { color: var(--muted-2); font-size: 11px; }
.rhyme-subtabs { position: sticky; top: 69px; z-index: 25; display: flex; gap: 6px; margin: 12px 0; overflow-x: auto; padding: 8px 2px; background: var(--canvas); border-bottom: 1px solid var(--line); min-height: 44px; align-items: center; }
@media (max-width: 559px) { .rhyme-subtabs { top: 69px; margin: 0; border-radius: 0; } }
.rhyme-subtabs button { flex: none; padding: 8px 15px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font-size: 12.5px; font-weight: 800; }
.rhyme-subtabs button.active { background: linear-gradient(145deg, #4d45cc, #7566e3); border-color: transparent; color: #fff; box-shadow: 0 6px 16px #2c248c26; }
.rhyme-subtab-count { flex: none; margin-left: auto; padding: 6px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.rhyme-group { margin-bottom: 12px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: var(--shadow-sm); }
.rhyme-group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
.rhyme-group-head h3 { margin: 0; font-size: 14.5px; }
.rhyme-group-head small { display: block; margin-top: 3px; color: var(--muted-2); font-size: 11px; }
.rhyme-group-title-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.rhyme-group-title-line h3 { flex: none; }
.rhyme-group-title-line small { margin-top: 0; white-space: nowrap; }
.rhyme-progress-badge { flex: none; padding: 5px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 11.5px; font-weight: 800; }
.rhyme-play-all { flex: none; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--brand-border); color: var(--brand); font-size: 11.5px; font-weight: 800; cursor: pointer; }
.rhyme-play-all.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.rhyme-songs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; }
.rhyme-song { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
.rhyme-song.done { border-color: var(--green-border); background: var(--green-soft); }
.rhyme-song-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 0; text-align: left; }
.rhyme-song-no { flex: none; min-width: 26px; padding: 3px 6px; border-radius: 8px; background: #f1f2f6; color: var(--muted-2); font-size: 10.5px; font-weight: 800; text-align: center; }
.rhyme-song-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; color: var(--ink); }
.rhyme-song .tiny-action { flex: none; width: 51px; text-align: center; padding-left: 0; padding-right: 0; border: 1px solid #7C6CF0; background: #fff; color: #5B4BD6; box-shadow: none; }
.rhyme-song .tiny-action.done { background: #EDEAFD; border-color: #EDEAFD; color: #5B4BD6; }
.rhyme-song-play { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--brand); background: #fff; color: var(--brand); font-size: 11px; display: grid; place-items: center; padding: 0; }
.rhyme-song-play.playing { background: var(--brand); color: #fff; }

const STORAGE_KEY = "sss-33-week-progress-v1";
const WORD_KEY = "sss-workbench-flashcards-v1";
const GAME_KEY = "sss-workbench-games-v1";
const STEP_KEY = "sss-workbench-steps-v1";

const loadState = (key, fallback) => {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)) || fallback; } catch { return fallback; }
};
const saveState = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

let songState = loadState(STORAGE_KEY, {});
let cardState = loadState(WORD_KEY, {});
let gameState = loadState(GAME_KEY, []);
let stepState = loadState(STEP_KEY, {});

const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[char]));

const { weeks, songs } = window.SSS_WEB_DATA || {};
const songBySheet = new Map((songs || []).map((song) => [song.sheet, song]));
const patterns = window.SSS_PATTERN_LIBRARY || [];

const todayInfo = () => {
  const start = new Date(2026, 8, 14);
  const now = new Date();
  const day = Math.max(0, Math.floor((now - start) / 86400000));
  const weekIndex = Math.min((weeks?.length || 1) - 1, Math.floor(day / 7));
  const dayIndex = day % 7;
  const week = weeks[weekIndex] || weeks[0];
  const songItem = week.songs[dayIndex % week.songs.length] || week.songs[0];
  return { day, dayIndex, weekIndex, week, songItem };
};

const isDone = (sheet) => {
  const saved = songState[sheet];
  const value = typeof saved === "object" && saved ? saved.status : saved;
  return value === "已完成";
};

const toggleSong = (sheet) => {
  const next = !isDone(sheet);
  songState[sheet] = next ? { status: "已完成", completedAt: new Date().toISOString() } : { status: "待打卡", completedAt: "" };
  saveState(STORAGE_KEY, songState);
};

const flashcardsForToday = () => (window.SSS_NOUN_CARDS || []).slice(0, 5);
const gamesForToday = () => {
  const games = window.SUSAN_GAMES_DATA || [];

/* Zoom in 内容（移植自参考站 genZoom） */
const ZOOM_HOWTO = '用「音效·表情·动作·变大变小·变换角色·变颜色·反常识」把这一张词演活，钻进它的小世界聊天。练习顺序：每句话先加一个音效，稳定了加表情，再加动作，一步步叠加刻意练习。记得多提问、留气口，让宝宝多说，而不是自己一直讲。';
const ZOOM_HOWTO_EN = '💬 Say these with your child — read them out loud and play together! Each line is something you can say right now.';
function genZoom(c){
  var cn = c.cn || '', w = c.w || '', cat = c.cat || 'noun';
  var n = (typeof c.n === 'number') ? c.n : (parseInt(c.n,10)||0); if(!n) n = (c.id||0);
  // 完全发散：每个技巧一大池创意场景，按词号 PRNG 抽取，相邻卡互不相同、同词稳定
  function mul(seed){ var t = (seed>>>0) + 0x6D2B79F5; t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14))>>>0)/4294967296; }
  function pick(arr, seed){ return arr[Math.floor(mul(seed) * arr.length) % arr.length]; }
  var BANK = {
    noun:{
      sound:[
    {cn:'凑近「'+cn+'」，听听它会不会「嘀嘀」叫~', en:'Put your ear to the '+w+'. Does it go beep beep?'},
    {cn:'假装「'+cn+'」是个小喇叭，对着它「呜呜」吹一吹！', en:'Pretend the '+w+' is a horn. Blow whoosh whoosh into it!'},
    {cn:'学一学「'+cn+'」的叫声，和宝宝你一声我一声对喊~', en:'Copy the '+w+' sound. You call, baby calls back!'},
    {cn:'「'+cn+'」睡着了会打呼噜「呼噜呼噜」，轻轻戳戳它！', en:'The sleeping '+w+' goes snore snore. Gently poke it!'},
    {cn:'让「'+cn+'」当小鼓，用手指「咚咚」敲一敲，打节拍！', en:'The '+w+' is a drum. Tap tap-tap with your finger!'},

const VIDEO_MANIFEST = {

const videoCardNumber = (card) => {
  const n = Number(card && (card.number || card.n)) || 0;
  return n ? String(n).padStart(3, "0") : "";
};
const guideVideoUrl = (cat, card) => {
  const name = videoCardNumber(card);
  return name ? `${VIDEO_MANIFEST.g[0]}/videos/${cat}_g_${name}.mp4` : "";
};
const contextVideoUrl = (cat, card) => {
  const name = videoCardNumber(card);
  if (!name) return "";
  const bucket = cat === "adj" ? 1 : 0;
  return `${VIDEO_MANIFEST.c[bucket]}/${cat}_c_${name}.mp4`;
};
const openVideoModal = (src, title) => {
  if (!src) { toast("这个词的视频还没添加"); return; }
  document.getElementById("video-modal-title").textContent = title || "视频";
  const player = document.getElementById("video-modal-player");
  player.src = src;
  document.getElementById("video-modal").classList.add("open");
  document.body.style.overflow = "hidden";
  player.play().catch(() => {});
};
const closeVideoModal = () => {
  const player = document.getElementById("video-modal-player");
  player.pause();
  player.removeAttribute("src");
  player.load();
  document.getElementById("video-modal").classList.remove("open");
  document.body.style.overflow = "";
};

function renderFlashcards(cards) {
  return `<div class="flashcards">${cards.map((card) => {
    const checked = Boolean(cardState[String(card.number)]);
    return `<button class="flashcard ${checked ? "checked" : ""}" data-card="${card.number}" type="button">${card.image ? `<img src="${escapeHtml(card.image)}" alt="${escapeHtml(card.name)}" loading="lazy">` : ""}<div class="flashcard-body"><small>名词卡 ${card.number}</small><strong>${escapeHtml(card.name)}</strong><em>点一下标记学会了</em></div></button>`;
  }).join("")}</div>`;
}

function renderSentence(pattern, cards) {
  const base = pattern.pattern || "It's a/an ...";
  const rows = cards.slice(0, 3).map((card) => {
    const article = /^[aeiou]/i.test(card.name) ? "an" : "a";
    return `<div class="qa-item"><span class="pattern-label">${escapeHtml(pattern.code || "")}</span><h3>${escapeHtml(base.replace(/a\/an|a\/an\.\.\./i, "").trim())} ${article} ${escapeHtml(card.name.toLowerCase())}.</h3><p class="zh">这是${escapeHtml(card.name)}。</p></div>`;
  }).join("");
  return `<div class="sentence-box"><strong>${escapeHtml(base)}</strong><p>替换下面的名词说 3 遍，宝宝跟着说就算完成。</p></div><div class="qa-list" style="margin-top:10px">${rows}</div>`;
}

function renderGames(games) {
  return `<div class="game-list">${games.map((game) => {
    const done = gameState.includes(game.id);
    const dialogue = (game.dialogue || []).map((line) => `<div class="${line.who}"><b>${line.who === "mom" ? "👩 妈妈" : "🧒 宝宝"}</b>${escapeHtml(line.text)}</div>`).join("");
    return `<article class="game-card"><div class="game-card-head"><h3>${escapeHtml(game.name)}</h3><small>${escapeHtml(game.scene || "")} · ${escapeHtml(game.age || "")}岁</small></div><div class="game-card-body"><p>${escapeHtml(game.how || "")}</p><div class="game-props">${(game.props || []).map((prop) => `<span>${escapeHtml(prop)}</span>`).join("")}</div><div class="dialogue">${dialogue}</div></div></article>`;
  }).join("")}</div>`;
}

  const card = event.target.closest("[data-card]");
  if (card) {
    const key = card.dataset.card;
    cardState[key] = !cardState[key];
    saveState(WORD_KEY, cardState);
    render();
    return;
  }
  const game = event.target.closest("[data-game-toggle]");
  if (game) {
    const id = game.dataset.gameToggle;
    gameState = gameState.includes(id) ? gameState.filter((item) => item !== id) : [...gameState, id];
    saveState(GAME_KEY, gameState);
    toast(gameState.includes(id) ? "完成游戏，干得漂亮！" : "已取消");
    render();
    return;
  }
  const step = event.target.closest("[data-step-toggle]");
  if (step) {
    const key = step.dataset.stepToggle;
    stepState[key] = !stepState[key];
    saveState(STEP_KEY, stepState);
    render();
    return;
  }
  const songToggle = event.target.closest("[data-toggle-song]");
  if (songToggle) {
    toggleSong(songToggle.dataset.toggleSong);
    toast(isDone(songToggle.dataset.toggleSong) ? "已完成儿歌打卡" : "已取消打卡");
    render();
  }
});

const RHYME = window.RHYME_DATA || { themes: [], sceneGroups: [], tprSongs: [], planWeeks: [], songTpr: {}, songPreviews: {}, localAudio: {} };
let rhymeSection = "themes";
let rhymePreviewSongId = null;

const rhymeTitleKey = (t) => String(t || "").toLowerCase().replace(/\s+/g, " ").replace(/[^a-z0-9&' ]/g, "").trim();
const rhymeAllSongs = () => {
  const items = [];
  const seenTitles = new Set();
  RHYME.themes.forEach((theme) => theme.songs.forEach((song) => {
    const key = rhymeTitleKey(song.title);
    if (seenTitles.has(key)) return;
    seenTitles.add(key);
    items.push({ ...song, themeId: theme.id, themeNumber: theme.number, themeName: theme.name });
  }));
  RHYME.sceneGroups.forEach((group) => group.songs.forEach((song) => {
    const key = rhymeTitleKey(song.title);
    if (seenTitles.has(key)) return;
    seenTitles.add(key);
    items.push({ ...song, themeId: group.id, themeName: `场景 ${group.num} · ${group.name}` });
  }));
  RHYME.tprSongs.forEach((song) => {
    const key = rhymeTitleKey(song.title);
    if (seenTitles.has(key)) return;
    seenTitles.add(key);
    items.push({ ...song, themeId: "theme-11", themeName: "TPR儿歌" });
  });
  RHYME.planWeeks.forEach((week) => week.songs.forEach((song) => {
    const key = rhymeTitleKey(song.title);
    if (seenTitles.has(key)) return;
    seenTitles.add(key);
    items.push({ ...song, themeId: `plan-week-${week.week}`, themeName: `第${week.week}周` });
  }));
  return items;
};
const rhymeSongById = new Map(rhymeAllSongs().map((song) => [song.id, song]));
const rhymeAudio = (songId) => RHYME.localAudio[songId] || "";
const rhymePreview = (songId) => RHYME.songPreviews[songId] || { poster: "", lyric: "", flashcards: [] };
const rhymeSiblingsById = (() => {
  const map = new Map();
  const groups = new Map();
  const add = (song) => {
    if (!song) return;
    const key = rhymeTitleKey(song.title);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(song.id);
  };
  (RHYME.themes || []).forEach((t) => t.songs.forEach(add));
  (RHYME.sceneGroups || []).forEach((g) => g.songs.forEach(add));
  (RHYME.tprSongs || []).forEach(add);
  (RHYME.planWeeks || []).forEach((w) => w.songs.forEach(add));
  groups.forEach((ids) => ids.forEach((id) => map.set(id, ids)));
  return map;
})();
const isRhymeDone = (songId) => {
  const ids = rhymeSiblingsById.get(songId) || [songId];
  return ids.some((id) => Boolean(songState[id]));
};
const toggleRhymeDone = (songId) => {
  const ids = rhymeSiblingsById.get(songId) || [songId];
  const willCheck = !isRhymeDone(songId);
  ids.forEach((id) => {
    if (willCheck) songState[id] = { at: Date.now() };
    else delete songState[id];
  });
  saveState(STORAGE_KEY, songState);
};

const sectionSongCounts = () => ({

const startGlobalQueue = (tracks, fromIndex, source = "all") => {
  const button = document.getElementById("rhyme-playall-button");
  const checkedBtn = document.getElementById("rhyme-play-checked-button");
  rhymeQueueSource = source;
  rhymeQueue = tracks;
  rhymeQueueIndex = fromIndex;
  const audio = new Audio(rhymeAudio(tracks[fromIndex].id));
  rhymeGlobalPlaylist = audio;
  button.classList.toggle("on", source !== "checked");
  checkedBtn.classList.toggle("on", source === "checked");
  button.textContent = source === "checked" ? "▶ 一键磨耳朵" : "⏸ 停止磨耳朵";

  const bar = document.getElementById("rhyme-global-player");
  const titleEl = document.getElementById("rhyme-global-title");

    if (progressEl) progressEl.textContent = `正在播放 ${rhymeQueueIndex + 1}/${tracks.length} · ${{ themes: "全部", plan: "打卡计划", scene: "场景儿歌", tpr: "TPR儿歌" }[rhymeSection] || ""}`;
  };
  updateStatus();
  audio.addEventListener("ended", () => {
    try { pushPlayHistory(tracks[rhymeQueueIndex].id, tracks[rhymeQueueIndex].title, audio.duration || 0); } catch {}
    rhymeQueueIndex += 1;
    if (rhymeQueueIndex >= tracks.length) { stopRhymeGlobal(); return; }

const wordPools = () => {
  const nouns = (window.SSS_NOUN_CARDS || []).map((c) => ({ word: (cardName(c, "noun") || "").toLowerCase(), image: c.image || "" }));
  const verbs = (window.SUSAN_VERB_CARDS || []).map((c) => {
    const raw = String(c.word || "");
    const clean = (raw.split(/[\n\r]/)[0].match(/[a-zA-Z]+/g) || ["go"])[0].toLowerCase();
    return { word: clean, image: c.image || "" };
  });
  const adjs = (window.SUSAN_ADJECTIVE_CARDS || []).map((c) => ({ word: (c.word || c.name || "").toLowerCase(), image: c.image || "" }));
  if (sentenceLearnedOnly) {
    const learned = (keyPrefix) => Object.entries(cardOutputState).filter(([k, v]) => k.startsWith(keyPrefix) && v >= 1).map(([k]) => Number(k.split(":").pop()));
    const learnedNounNums = new Set(learned("output:noun-checkin:"));
    const learnedVerbNums = new Set(learned("output:verb-checkin:"));
    const learnedAdjNums = new Set(learned("output:adjective-checkin:"));
    return {
      nouns: nouns.filter((c) => learnedNounNums.size === 0 || learnedNounNums.has(0)),
      verbs: verbs.filter((_, i) => learnedVerbNums.has(i + 1)),
      adjs: adjs.filter((_, i) => learnedAdjNums.has(i + 1))
    };
  }
  return { nouns, verbs, adjs };
};
const patternParts = () => {
  const pools = wordPools();
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const diff = sentenceDifficulty;
  const noun = pick(pools.nouns.length ? pools.nouns : [{ word: "thing", image: "" }]);
  const verb = pick(pools.verbs.length ? pools.verbs : [{ word: "go", image: "" }]);
  const adj = pick(pools.adjs.length ? pools.adjs : [{ word: "nice", image: "" }]);
  noun.kind = "noun"; verb.kind = "verb"; adj.kind = "adj";
  if (diff === "noun") return [noun];
  if (diff === "noun-verb") return [noun, verb];
  return [noun, verb, adj];
};

/* ---------- 我说你猜：完整学习站"描述猜词"数据（52-90 号卡） ---------- */
let guessRound = null;
const guessCardsData = () => (window.SSS_GUESS_PROPER || []).filter((c) => c.clues.length >= 2);

function startGuessRound() {
  const all = guessCardsData();
  if (all.length < 4) return;
  const shuffled = [...all].sort(() => Math.random() - 0.5);
  const answer = shuffled[0];
  const others = shuffled.slice(1, 4);
  const options = [answer, ...others].sort(() => Math.random() - 0.5);
  guessRound = { answer, options };
  renderGuessRound();
}

function renderGuessRound() {
  const cluesEl = document.getElementById("guess-clues");
  const optionsEl = document.getElementById("guess-options");
  const revealBtn = document.getElementById("guess-reveal");
  if (!guessRound) { cluesEl.innerHTML = `<p class="empty-note">点「开始猜词」出题。</p>`; optionsEl.innerHTML = ""; if (revealBtn) revealBtn.hidden = true; return; }
  const clues = guessRound.answer.clues;
  cluesEl.innerHTML = clues.map((line, i) => `<div style="padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px"><b style="color:var(--brand);margin-right:8px">${i + 1}</b>${escapeHtml(line)}</div>`).join("");
  optionsEl.innerHTML = guessRound.options.map((card) => {
    const visual = card.nounImage
      ? `<img src="${escapeHtml(card.nounImage)}" alt="" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block" loading="lazy">`
      : `<div style="aspect-ratio:1/1;display:grid;place-items:center;background:#eef0f7"><span style="font-size:28px;font-weight:800;color:var(--muted)">❓</span></div>`;
    return `<button class="guess-option" data-guess-option-btn="${card.number}" style="border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;padding:0;cursor:pointer">${visual}<div style="padding:7px 8px;font-size:13px;font-weight:800;text-transform:capitalize">${escapeHtml(card.name)}</div></button>`;
  }).join("");
  if (revealBtn) revealBtn.hidden = true;
}

function pickGuess(number) {
  if (!guessRound) return;
  const { answer } = guessRound;
  [...document.querySelectorAll("[data-guess-option-btn]")].forEach((btn) => {
    const num = btn.dataset.guessPick;
    if (Number(num) === answer.number) { btn.style.borderColor = "var(--green)"; btn.style.background = "var(--green-soft)"; }
    else if (Number(num) === Number(number)) { btn.style.borderColor = "#e5484d"; btn.style.background = "#fde8e8"; }
  });
  const revealBtn = document.getElementById("guess-reveal");
  if (revealBtn) revealBtn.hidden = false;
  toast(Number(number) === answer.number ? "猜对啦！🎉" : "不对哦，再看看线索");
}

function revealGuess() {
  if (!guessRound) return;
  const { answer } = guessRound;
  [...document.querySelectorAll("[data-guess-option-btn]")].forEach((btn) => {
    if (Number(btn.dataset.guessPick) === answer.number) { btn.style.borderColor = "var(--green)"; btn.style.background = "var(--green-soft)"; }
  });
}

/* ---------- Parent tab ---------- */
function renderParent() {
  const checkinLists = window.SUSAN_CHECKIN_DATA?.lists || [];
  const totalDone = songs.filter((item) => isDone(item.sheet)).length;
  const patternByType = { "名词卡": 0, "动词卡": 0, "形容词卡": 0 };
  patterns.forEach((p) => { if (patternByType[p.type] != null) patternByType[p.type] += 1; });

  const parseValue = (value) => {
    const m = String(value).match(/^(\d+)\/(\d+)$/);
    return m ? { done: Number(m[1]), total: Number(m[2]) } : null;
  };
  const cardHtml = ([label, value, note, link]) => {
    const nums = parseValue(value);
    const percent = nums ? (nums.total ? Math.round(nums.done / nums.total * 100) : 0) : null;
    const noteHtml = note ? `<span>${escapeHtml(note)}</span>` : "";
    const barHtml = nums ? `<div class="parent-bar"><i style="width:${percent}%"></i></div>` : "";
    const icon = link ? `<span style="position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:12px">📊</span>` : "";
    const inner = `<h3>${escapeHtml(label)}</h3><p>${escapeHtml(note)}</p><div class="stat-line">${noteHtml}<b>${escapeHtml(value)}</b></div>${barHtml}${icon}`;
    if (link) return `<article class="parent-card" data-open-report="${link}" style="position:relative;cursor:pointer">${inner}</article>`;
    return `<article class="parent-card">${inner}</article>`;
  };

  const todayInfo = todayInfoSafe();
  const listenStats = todayListenStats();
  const newRhymeCount = todayNewRhymeCount();
  const todayRows = [
    ["熏听时长", `${listenStats.minutes}min / ${listenStats.songCount}首`, `共 ${listenStats.count} 次`, "report"],
    ["新增儿歌", `${newRhymeCount} 首`, "今日标记打卡"],
    ["今日闪卡", `${todayFlashDone()} 张`, "标记已学"],
    ["今日句型", `${todayPatternDone()}/1`, "本周句型"],
  ];

  const pct = (done, total) => total ? Math.round(done / total * 100) : 0;
  const inputRows = [
    ["儿歌打卡", `${totalDone}/${songs.length}`, `完成率 ${pct(totalDone, songs.length)}%`],
    ...checkinLists.map((list) => {
      const done = list.items.filter((item) => loadState(`${list.id}:checkin`, {})[item.number]).length;
      return [`${list.label}打卡`, `${done}/${list.items.length}`, `完成率 ${pct(done, list.items.length)}%`];
    }),
  ];

  const patternState = loadState("sss-pattern-progress-v1", {});
  const countPatternDone = (type) => patterns.filter((item) => item.type === type && patternState[String(item.number)]?.status === "已完成").length;
  const outputRows = [
    ["名词句型", `${countPatternDone("名词卡")}/${patternByType["名词卡"]}`, `完成率 ${pct(countPatternDone("名词卡"), patternByType["名词卡"])}%`],
    ["动词句型", `${countPatternDone("动词卡")}/${patternByType["动词卡"]}`, `完成率 ${pct(countPatternDone("动词卡"), patternByType["动词卡"])}%`],
    ["形容词句型", `${countPatternDone("形容词卡")}/${patternByType["形容词卡"]}`, `完成率 ${pct(countPatternDone("形容词卡"), patternByType["形容词卡"])}%`],
  ];

  document.getElementById("parent-today-cards").innerHTML = todayRows.map(cardHtml).join("");
  document.getElementById("parent-cards").innerHTML = inputRows.map(cardHtml).join("");
  document.getElementById("parent-output-cards").innerHTML = outputRows.map(cardHtml).join("");
}

function todayInfoSafe() {
  try {
    const week = weeks?.[todayInfo().weekIndex] || weeks?.[0];
    const weekSongs = week?.songs?.length || 0;
    const weekDone = (week?.songs || []).map((item) => songBySheet.get(item.sheet)).filter((s) => s && isDone(s.sheet)).length;
    return { weekSongs, weekDone };
  } catch { return { weekSongs: 0, weekDone: 0 }; }
}

function todayPatternDone() {
  try {
    const pattern = patternForWeek(todayInfo().week);
    return patternIsDone(pattern.type, pattern.number) ? 1 : 0;
  } catch { return 0; }
}

function todayListenStats() {
  try {
    const today = new Date().toDateString();
    const stats = loadState("sss-workbench-listen-v1", {});
    const day = stats[today] || { seconds: 0, count: 0, songs: new Set() };
    const songsSet = new Set(day.songs || []);
    return { minutes: Math.round((day.seconds || 0) / 60), count: day.count || 0, songCount: songsSet.size };
  } catch { return { minutes: 0, count: 0, songCount: 0 }; }
}

function recordListen(seconds, songId) {
  try {
    const today = new Date().toDateString();
    const stats = loadState("sss-workbench-listen-v1", {});
    const day = stats[today] || { seconds: 0, count: 0, songs: [] };
    day.seconds = (day.seconds || 0) + Math.max(0, Math.round(seconds));
    day.count = (day.count || 0) + 1;
    if (songId && !(day.songs || []).includes(songId)) (day.songs = day.songs || []).push(songId);
    stats[today] = day;
    saveState("sss-workbench-listen-v1", stats);
  } catch {}
}

function todayNewRhymeCount() {
  try {
    const todayKey = new Date().toISOString().slice(0, 10);
    let count = 0;
    Object.entries(songState).forEach(([, value]) => {
      if (!value || typeof value !== "object") return;
      const at = value.completedAt || (value.at ? new Date(value.at).toISOString() : "");
      if (at && at.slice(0, 10) === todayKey) count += 1;
    });
    return count;
  } catch { return 0; }
}

function todayFlashDone() {
  try {
    const flashcards = flashcardsForToday();
    return flashcards.filter((card) => cardState[String(card.number)]).length;
  } catch { return 0; }
}

/* ---------- Card library detail (click to toggle mastery) ---------- */
document.addEventListener("click", (event) => {
  const stageButton = event.target.closest("[data-card-stage]");
  if (stageButton) {
    event.stopPropagation();
    const key = stageButton.dataset.cardStage;
    const next = (Number(cardOutputState[key] || 0) + 1) % 3;
    cardOutputState[key] = next;
    saveState("sss-workbench-card-output-v1", cardOutputState);
    const checkinKey = key.replace(/^output:/, "");
    checkinState[checkinKey] = next >= 1;
    saveCheckinState();
    renderCards();
    toast(["未学", "已学未输出", "已学已输出"][next]);
    return;
  }
  const tile = event.target.closest("[data-card-library]");
  if (!tile) return;
  const [type, number] = tile.dataset.cardLibrary.split(":");
  renderCardDetail(type, Number(number));
});

document.getElementById("video-modal-close").addEventListener("click", closeVideoModal);
document.getElementById("video-modal").addEventListener("click", (event) => {
  if (event.target.id === "video-modal") closeVideoModal();
});

window.addEventListener("storage", (event) => {
  if (event.key !== STORAGE_KEY) return;
  songState = loadState(STORAGE_KEY, {});
  render();
});

if (!weeks || !weeks.length) {
  document.querySelector(".page").innerHTML = `<section class="module"><div class="module-body"><p>数据加载失败，请确认和 index.html 在同一目录。</p></div></section>`;
} else {
  render();
}
</script>
</body>
</html>
