<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b70">
<meta name="description" content="今日学习工作台：一句话把今天的英语启蒙说出来。">
<title>今日学习工作台</title>
<link rel="icon" href="data:,">
<style>
:root {
  --ink: #17323a; --muted: #6b7c7f; --brand: #176b70; --brand-deep: #104e53; --brand-soft: #e8f3f2;
  --yellow: #f5c451; --yellow-soft: #fff7dc; --green: #23775c; --line: #dce6e5; --canvas: #f4f7f6;
  --shadow: 0 10px 28px rgba(26,58,61,.09);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button { cursor: pointer; }
.topbar { background: #fff; border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1320px; margin: 0 auto; padding: 14px clamp(16px, 3vw, 40px); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 800; font-size: 12px; }
.brand-copy strong, .brand-copy small { display: block; }
.brand-copy strong { font-size: 16px; }
.brand-copy small { margin-top: 3px; color: var(--muted); font-size: 12px; }
.site-link { flex: none; padding: 9px 14px; border: 1px solid #cbd8d6; border-radius: 7px; background: #fff; color: var(--brand-deep); font-size: 13px; font-weight: 700; text-decoration: none; }
.site-link:hover { border-color: var(--brand); background: var(--brand-soft); }
.page { max-width: 1320px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 40px) 80px; }
.hero { position: relative; overflow: hidden; padding: 24px 26px 30px; border-radius: 12px; background: linear-gradient(120deg, #0d494e, #176b70 55%, #1e848c); color: #fff; box-shadow: var(--shadow); }
.hero-kicker { margin: 0; color: #9fd2ce; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
.hero h1 { margin: 7px 0 9px; font-size: 28px; line-height: 1.2; }
.hero-desc { margin: 0; max-width: 640px; color: #cfe6e4; font-size: 13.5px; line-height: 1.6; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.button { min-height: 40px; border: 1px solid transparent; border-radius: 6px; padding: 9px 14px; background: var(--yellow); color: #3e310e; font-weight: 700; display: inline-flex; align-items: center; }
.button.secondary { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.14); color: #fff; }
.button:hover { filter: brightness(1.05); }
.hero-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.2); }
.hero-progress i { display: block; width: 0; height: 100%; background: var(--yellow); transition: width .25s ease; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0 22px; }
.stat { padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.stat span { display: block; color: var(--muted); font-size: 11px; }
.stat strong { display: block; margin-top: 4px; font-size: 20px; }
.stat small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
.module { margin-bottom: 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.module-head { padding: 13px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.module-head h2 { margin: 0; font-size: 16px; }
.module-head span { color: var(--muted); font-size: 12px; }
.module-body { padding: 16px; }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.step.done { border-color: var(--green); background: #f2faf7; }
.step-num { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 800; }
.step.done .step-num { background: var(--green); color: #fff; }
.step-title { display: block; font-size: 15px; font-weight: 800; }
.step-title small { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-deep); font-size: 11px; }
.step-desc { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
.step-actions { display: flex; gap: 8px; align-items: center; }
.tiny-action { min-height: 34px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--brand-deep); font-weight: 700; font-size: 12.5px; }
.tiny-action:hover { border-color: var(--brand); color: var(--brand); }
.tiny-action.done { background: var(--green); border-color: var(--green); color: #fff; }
.flashcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.flashcard { position: relative; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; text-align: left; padding: 0; }
.flashcard img { display: block; width: 100%; height: 130px; object-fit: cover; background: #eef4f3; }
.flashcard-body { padding: 10px 12px 12px; }
.flashcard-body small { display: block; color: var(--muted); font-size: 11px; }
.flashcard-body strong { display: block; margin-top: 3px; font-size: 15px; }
.flashcard-body em { display: block; margin-top: 2px; color: var(--muted); font-style: normal; font-size: 12px; }
.flashcard.checked { border-color: var(--green); background: #f4fbf8; }
.flashcard.checked::after { content: "✓"; position: absolute; right: 8px; top: 8px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #fff; font-size: 13px; font-weight: 800; }
.game-list { display: grid; gap: 10px; }
.game-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.game-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: #f7faf9; border-bottom: 1px solid var(--line); }
.game-card-head h3 { margin: 0; font-size: 14px; }
.game-card-head small { color: var(--muted); font-size: 11px; }
.game-card-body { padding: 12px 14px; }
.game-card-body p { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.6; }
.game-props { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.game-props span { padding: 4px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-deep); font-size: 11.5px; }
.dialogue { display: grid; gap: 6px; }
.dialogue div { padding: 8px 10px; border-radius: 8px; background: #f4f7f6; font-size: 12.5px; line-height: 1.55; }
.dialogue div.mom { background: #e8f3f2; }
.dialogue div.kid { background: #fff7dc; }
.dialogue b { margin-right: 6px; color: var(--brand-deep); font-size: 11.5px; }
.sentence-box { padding: 14px 16px; background: var(--brand-soft); border-radius: 10px; }
.sentence-box strong { display: block; font-size: 22px; line-height: 1.3; }
.sentence-box p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.qa-list { display: grid; gap: 10px; }
.qa-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.qa-item .pattern-label { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--yellow-soft); color: #8a5a12; font-size: 11.5px; font-weight: 800; }
.qa-item h3 { margin: 8px 0 6px; font-size: 15px; }
.qa-item .qa-line { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; }
.qa-item .qa-line b { color: var(--brand); font-size: 12px; min-width: 18px; }
.qa-item .qa-line span { font-size: 13.5px; line-height: 1.5; }
.qa-item .zh { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.song-list { display: grid; gap: 8px; }
.song-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.song-item.done { border-color: var(--green); background: #f4fbf8; }
.song-item strong { font-size: 14px; }
.song-item small { display: block; color: var(--muted); font-size: 11.5px; }
.status { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; }
.status.pending { background: var(--yellow-soft); color: #8a5a12; }
.status.done { background: #e5f3ed; color: #176b50; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.page-foot { margin-top: 26px; color: var(--muted); font-size: 12px; line-height: 1.75; }
.page-foot p { margin: 0 0 6px; }
.toast { position: fixed; left: 50%; bottom: 22px; z-index: 30; transform: translateX(-50%); padding: 9px 14px; border-radius: 999px; color: #fff; background: #1e2e31; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
@media (max-width: 720px) {
  .step { grid-template-columns: 40px minmax(0, 1fr); }
  .step-actions { grid-column: 2; margin-top: 8px; }
  .hero h1 { font-size: 23px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">SSS</span>
      <div class="brand-copy"><strong>今日学习工作台</strong><small>每天 12 分钟 · 把一句话说出来</small></div>
    </div>
    <a class="site-link" href="index.html" target="_blank" rel="noopener">打开完整学习站 ↗</a>
  </div>
</header>

<main class="page">
  <section class="hero">
    <p class="hero-kicker">SUSAN LEARNING DESK · TODAY</p>
    <h1 id="hero-title">今天，和宝宝一起把一句话说出来。</h1>
    <p class="hero-desc">围绕本周句型，完成一轮输入、闪卡、游戏和亲子阅读。短一点、重复多一点，孩子更容易开口。</p>
    <div class="hero-actions">
      <a class="button" id="open-song" href="index.html" target="_blank" rel="noopener">打开今日儿歌拆解 ↗</a>
      <button class="button secondary" id="start-today" type="button">开始今天</button>
    </div>
    <div class="hero-progress"><i id="hero-bar"></i></div>
  </section>

  <div class="stats">
    <div class="stat"><span>本周句型</span><strong id="stat-pattern">-</strong><small id="stat-pattern-cn"></small></div>
    <div class="stat"><span>本周儿歌</span><strong id="stat-songs">-</strong><small id="stat-songs-sub"></small></div>
    <div class="stat"><span>今日闪卡</span><strong id="stat-cards">0/5</strong><small>点卡片标记学会了</small></div>
    <div class="stat"><span>今日游戏</span><strong id="stat-games">0/3</strong><small>挑 1–3 个玩就算打卡</small></div>
  </div>

  <div id="steps-root"></div>

  <footer class="page-foot">
    <p>打卡进度保存在本机浏览器，与「完整学习站」共用同一份记录（同一浏览器、同一打开方式）。</p>
    <p>数据来源：Susan 33 周 SSS 儿歌计划 · 99 首儿歌 / 219 个核心句型。</p>
  </footer>
</main>

<script src="data.js"></script>
<script src="pattern-data.js"></script>
<script src="noun-card-data.js"></script>
<script src="games-data.js"></script>
<script>
const STORAGE_KEY = "sss-33-week-progress-v1";
const WORD_KEY = "sss-workbench-flashcards-v1";
const GAME_KEY = "sss-workbench-games-v1";
const STEP_KEY = "sss-workbench-steps-v1";

const loadState = (key, fallback) => {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)) || fallback; } catch { return fallback; }
};
const saveState = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

let songState = loadState(STORAGE_KEY, {});
let cardState = loadState(WORD_KEY, {});
let gameState = loadState(GAME_KEY, []);
let stepState = loadState(STEP_KEY, {});

const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[char]));

const { weeks, songs } = window.SSS_WEB_DATA || {};
const songBySheet = new Map((songs || []).map((song) => [song.sheet, song]));
const patterns = window.SSS_PATTERN_LIBRARY || [];

const todayInfo = () => {
  const start = new Date(2026, 8, 14);
  const now = new Date();
  const day = Math.max(0, Math.floor((now - start) / 86400000));
  const weekIndex = Math.min((weeks?.length || 1) - 1, Math.floor(day / 7));
  const dayIndex = day % 7;
  const week = weeks[weekIndex] || weeks[0];
  const songItem = week.songs[dayIndex % week.songs.length] || week.songs[0];
  return { day, dayIndex, weekIndex, week, songItem };
};

const isDone = (sheet) => {
  const saved = songState[sheet];
  const value = typeof saved === "object" && saved ? saved.status : saved;
  return value === "已完成";
};

const toggleSong = (sheet) => {
  const next = !isDone(sheet);
  songState[sheet] = next ? { status: "已完成", completedAt: new Date().toISOString() } : { status: "待打卡", completedAt: "" };
  saveState(STORAGE_KEY, songState);
};

const flashcardsForToday = () => (window.SSS_NOUN_CARDS || []).slice(0, 5);
const gamesForToday = () => {
  const games = window.SUSAN_GAMES_DATA || [];
  return ["pat", "beanbag", "jump"].map((id) => games.find((game) => game.id === id)).filter(Boolean);
};

const patternForWeek = (week) => {
  const weekNumber = week.week || 1;
  return patterns.find((item) => item.type === "名词卡" && item.number === weekNumber) || patterns[0] || {};
};

const youtubeThumbnail = (url) => {
  const match = String(url || "").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return match ? `https://i.ytimg.com/vi/${match[1]}/hqdefault.jpg` : "";
};

const toast = (message) => {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
};

const dayNames = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

function render() {
  const { dayIndex, week, songItem } = todayInfo();
  const song = songBySheet.get(songItem.sheet) || {};
  const pattern = patternForWeek(week);
  const flashcards = flashcardsForToday();
  const games = gamesForToday();
  const weekSongs = week.songs.map((item) => songBySheet.get(item.sheet)).filter(Boolean);

  const checkedCards = flashcards.filter((card) => cardState[String(card.number)]).length;
  const doneGames = games.filter((game) => gameState.includes(game.id)).length;
  const weekDone = weekSongs.filter((item) => isDone(item.sheet)).length;
  const totalDone = songs.filter((item) => isDone(item.sheet)).length;

  document.getElementById("stat-pattern").textContent = pattern.pattern || "It's a/an ...";
  document.getElementById("stat-pattern-cn").textContent = `${pattern.code || "A1"} · ${week.label} ${week.theme}`;
  document.getElementById("stat-songs").textContent = `${weekDone}/${weekSongs.length}`;
  document.getElementById("stat-songs-sub").textContent = song.title || "";
  document.getElementById("stat-cards").textContent = `${checkedCards}/${flashcards.length}`;
  document.getElementById("stat-games").textContent = `${doneGames}/${games.length}`;
  document.getElementById("hero-bar").style.width = `${songs.length ? Math.round(totalDone / songs.length * 100) : 0}%`;

  const cover = youtubeThumbnail(song.videoUrl);
  const heroTitle = document.getElementById("hero-title");
  heroTitle.textContent = song.title ? `${song.title}` : "今天，和宝宝一起把一句话说出来。";
  const openSong = document.getElementById("open-song");
  openSong.href = `index.html?song=${encodeURIComponent(song.sheet || "")}`;

  const stepDefs = [
    {
      key: "warmup", num: 1, title: "暖场输入", time: "1分钟", desc: "放本周儿歌，宝宝自由玩，不用坐着。听完一遍就算过。",
      action: `<a class="tiny-action" href="${escapeHtml(openSong.href)}" target="_blank" rel="noopener">打开儿歌</a>`,
    },
    {
      key: "flashcards", num: 2, title: "今日闪卡", time: "2分钟", desc: "点卡片翻看，每张停 3 秒，说 2 遍。5 张都点了算完成。",
      custom: renderFlashcards(flashcards),
    },
    {
      key: "sentence", num: 3, title: "句型变体", time: "3分钟", desc: "用本周句型换不同名词说，宝宝跟着说一遍就算过。",
      custom: renderSentence(pattern, flashcards),
    },
    {
      key: "games", num: 4, title: "游戏 / 闯关", time: "5分钟", desc: "今天有 3 个游戏可选，挑 1–3 个玩，每个算打卡。",
      custom: renderGames(games),
    },
    {
      key: "reading", num: 5, title: "亲子阅读", time: "5分钟", desc: "睡前翻一本书，用本周句型问 1 个问题。",
      action: `<a class="tiny-action" href="index.html" target="_blank" rel="noopener">打开亲子阅读</a>`,
    },
  ];

  document.getElementById("steps-root").innerHTML = stepDefs.map((step) => {
    const done = step.key === "warmup" ? isDone(song.sheet)
      : step.key === "flashcards" ? checkedCards === flashcards.length
      : step.key === "games" ? doneGames > 0
      : step.key === "sentence" ? Boolean(stepState[step.key])
      : Boolean(stepState[step.key]);
    const actions = step.custom ? "" : `<button class="tiny-action${done ? " done" : ""}" data-step-toggle="${step.key}">${done ? "已完成 ✓" : "标记完成"}</button>${step.action || ""}`;
    return `<section class="module"><div class="module-head"><div><h2>第 ${step.num} 步 · ${escapeHtml(step.title)}</h2></div><span>${step.time}</span></div><div class="module-body"><div class="step ${done ? "done" : ""}"><div class="step-num">${done ? "✓" : step.num}</div><div><span class="step-title">${escapeHtml(step.title)}${done ? '<small>已完成</small>' : ""}</span><p class="step-desc">${escapeHtml(step.desc)}</p></div><div class="step-actions">${actions}</div></div>${step.custom ? `<div style="margin-top:12px">${step.custom}</div>` : ""}</div></section>`;
  }).join("");

  document.getElementById("steps-root").insertAdjacentHTML("beforeend", `<section class="module"><div class="module-head"><div><h2>本周儿歌</h2></div><span>${weekDone}/${weekSongs.length} 已完成</span></div><div class="module-body"><div class="song-list">${weekSongs.map((item) => `<div class="song-item ${isDone(item.sheet) ? "done" : ""}"><div><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.meta || "")}</small></div><div style="display:flex;align-items:center;gap:8px"><span class="status ${isDone(item.sheet) ? "done" : "pending"}">${isDone(item.sheet) ? "已完成" : "待打卡"}</span><button class="tiny-action" data-toggle-song="${escapeHtml(item.sheet)}">${isDone(item.sheet) ? "取消" : "完成"}</button></div></div>`).join("")}</div></div></section>`);
}

function renderFlashcards(cards) {
  return `<div class="flashcards">${cards.map((card) => {
    const checked = Boolean(cardState[String(card.number)]);
    return `<button class="flashcard ${checked ? "checked" : ""}" data-card="${card.number}" type="button">${card.image ? `<img src="${escapeHtml(card.image)}" alt="${escapeHtml(card.name)}" loading="lazy">` : ""}<div class="flashcard-body"><small>名词卡 ${card.number}</small><strong>${escapeHtml(card.name)}</strong><em>点一下标记学会了</em></div></button>`;
  }).join("")}</div>`;
}

function renderSentence(pattern, cards) {
  const base = pattern.pattern || "It's a/an ...";
  const rows = cards.slice(0, 3).map((card) => {
    const article = /^[aeiou]/i.test(card.name) ? "an" : "a";
    return `<div class="qa-item"><span class="pattern-label">${escapeHtml(pattern.code || "")}</span><h3>${escapeHtml(base.replace(/a\/an|a\/an\.\.\./i, "").trim())} ${article} ${escapeHtml(card.name.toLowerCase())}.</h3><p class="zh">这是${escapeHtml(card.name)}。</p></div>`;
  }).join("");
  return `<div class="sentence-box"><strong>${escapeHtml(base)}</strong><p>替换下面的名词说 3 遍，宝宝跟着说就算完成。</p></div><div class="qa-list" style="margin-top:10px">${rows}</div>`;
}

function renderGames(games) {
  return `<div class="game-list">${games.map((game) => {
    const done = gameState.includes(game.id);
    const dialogue = (game.dialogue || []).map((line) => `<div class="${line.who}"><b>${line.who === "mom" ? "👩 妈妈" : "🧒 宝宝"}</b>${escapeHtml(line.text)}</div>`).join("");
    return `<article class="game-card"><div class="game-card-head"><h3>${escapeHtml(game.name)}</h3><small>${escapeHtml(game.scene || "")} · ${escapeHtml(game.age || "")}岁</small></div><div class="game-card-body"><p>${escapeHtml(game.how || "")}</p><div class="game-props">${(game.props || []).map((prop) => `<span>${escapeHtml(prop)}</span>`).join("")}</div><div class="dialogue">${dialogue}</div><div style="margin-top:10px"><button class="tiny-action${done ? " done" : ""}" data-game-toggle="${escapeHtml(game.id)}">${done ? "已完成 ✓" : "完成游戏"}</button></div></div></article>`;
  }).join("")}</div>`;
}

document.addEventListener("click", (event) => {
  const card = event.target.closest("[data-card]");
  if (card) {
    const key = card.dataset.card;
    cardState[key] = !cardState[key];
    saveState(WORD_KEY, cardState);
    render();
    return;
  }
  const game = event.target.closest("[data-game-toggle]");
  if (game) {
    const id = game.dataset.gameToggle;
    gameState = gameState.includes(id) ? gameState.filter((item) => item !== id) : [...gameState, id];
    saveState(GAME_KEY, gameState);
    toast(gameState.includes(id) ? "完成游戏，干得漂亮！" : "已取消");
    render();
    return;
  }
  const step = event.target.closest("[data-step-toggle]");
  if (step) {
    const key = step.dataset.stepToggle;
    stepState[key] = !stepState[key];
    saveState(STEP_KEY, stepState);
    render();
    return;
  }
  const songToggle = event.target.closest("[data-toggle-song]");
  if (songToggle) {
    toggleSong(songToggle.dataset.toggleSong);
    toast(isDone(songToggle.dataset.toggleSong) ? "已完成儿歌打卡" : "已取消打卡");
    render();
  }
});

document.getElementById("start-today").addEventListener("click", () => {
  document.getElementById("steps-root").scrollIntoView({ behavior: "smooth", block: "start" });
});

window.addEventListener("storage", (event) => {
  if (event.key !== STORAGE_KEY) return;
  songState = loadState(STORAGE_KEY, {});
  render();
});

if (!weeks || !weeks.length) {
  document.querySelector(".page").innerHTML = `<section class="module"><div class="module-body"><p>数据加载失败，请确认和 index.html 在同一目录。</p></div></section>`;
} else {
  render();
}
</script>
</body>
</html>
