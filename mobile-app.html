<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='sss-33-week-progress-v1'; let state; try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'');
const status=sheet=>{const s=state[sheet];return(typeof s==='object'&&s?s.status:s)==='已完成'?'已完成':'待打卡'};
const done=sheet=>status(sheet)==='已完成';
const badge=s=>`<span class="mini-status ${s==='已完成'?'done':''}">${s}</span>`;

const PLAN=source.weeks,CATS=source.categories,songs=window.SSS_WEB_DATA.songs,bySheet=new Map(songs.map(x=>[x.sheet,x]));
function toIng(phrase){const [verb,...rest]=String(phrase||'').split(' ');const irregular={lie:'lying',pee:'peeing'};let ing=irregular[verb];if(!ing&&/ie$/.test(verb))ing=`${verb.slice(0,-2)}ying`;if(!ing&&/[^aeiou]e$/.test(verb))ing=`${verb.slice(0,-1)}ing`;if(!ing&&/^(clap|dig|hop|sit|run|stop|swim|stir|mop|pop)$/.test(verb))ing=`${verb}${verb.slice(-1)}ing`;if(!ing)ing=`${verb}ing`;return [ing,...rest].join(' ');}
$('week-data').textContent='';
const popNum=p=>Number(String(p.pattern||'').match(/(\d+)\s*\./)?.[1]);
const allPatternIds=songs.flatMap(s=>(s.patterns||[]).map(p=>{const n=popNum(p);return n?`${p.type}#${n}`:''})).filter(Boolean);
const cardNums=type=>new Set(songs.flatMap(s=>(s.patterns||[]).filter(p=>p.type===type).map(popNum).filter(Boolean)));
const totals={nouns:cardNums('名词卡').size,verbs:cardNums('动词卡').size,patterns:new Set(allPatternIds).size,tpr:songs.reduce((n,s)=>n+(s.tpr?.length||0),0)};
const thumb=url=>String(url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/)?.[1];
let chip='',q='',statusFilter='';
function drawChips(){
  const statusChips=[['','全部状态'],['已完成','已完成'],['待打卡','未完成']];
  $('chips').innerHTML=statusChips.map(([value,label])=>`<button class="chip ${statusFilter===value?'active':''}" data-status="${value}">${label}</button>`).join('')+CATS.map(c=>`<button class="chip ${chip===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}
function drawList(){
  const list=PLAN.map(w=>({...w,visible:w.songs.map(s=>(!q||norm(s.title+w.theme+w.category).includes(norm(q)))&&(!chip||w.category===chip)&&(!statusFilter||status(s.sheet)===statusFilter))})).filter(w=>w.visible.some(Boolean));
  const count=list.reduce((n,w)=>n+w.visible.filter(Boolean).length,0);
  $('note').textContent=`${list.length} 个周计划 · ${count} 首儿歌`;
  $('weeks').innerHTML=list.length?list.map(w=>{
    const d=w.songs.filter(s=>done(s.sheet)).length, all=d===w.songs.length;
    return `<article class="week-card ${all?'done':''}"><div class="week-top"><div><div class="week-title">${esc(w.label)} · ${esc(w.theme)}</div><div class="week-theme">${esc(w.category)}</div></div><span class="week-badge">${d}/${w.songs.length}</span></div>${w.songs.map((s,i)=>{if(!w.visible[i])return '';const st=status(s.sheet),info=bySheet.get(s.sheet),words=info?.words?.length||0;return `<div class="song-row ${st==='已完成'?'completed':''}"><span class="song-index">${i+1}</span><button class="song-name" type="button" data-open="${esc(s.sheet)}">${esc(s.title)}<div class="song-sub">${words} 个核心词汇</div></button><button class="toggle ${st==='已完成'?'is-done':''}" type="button" data-toggle="${esc(s.sheet)}">${st==='已完成'?'已完成':'完成'}</button></div>`}).join('')}</article>`;
  }).join(''):'<div class="empty">没有匹配的儿歌</div>';
}
function drawStats(){
  const sheets=PLAN.flatMap(w=>w.songs.map(s=>s.sheet)), ds=new Set(sheets.filter(done)), dsongs=songs.filter(s=>ds.has(s.sheet));
  const nouns=new Set(),verbs=new Set(),pats=new Set();
  dsongs.forEach(s=>(s.patterns||[]).forEach(p=>{const n=popNum(p);if(!n)return;if(p.type==='名词卡')nouns.add(n);if(p.type==='动词卡')verbs.add(n);pats.add(`${p.type}#${n}`)}));
  const vals=[['名词',nouns.size,totals.nouns],['动词',verbs.size,totals.verbs],['核心句型',pats.size,totals.patterns],['TPR指令',dsongs.reduce((n,s)=>n+(s.tpr?.length||0),0),totals.tpr]];
  $('resourceStats').innerHTML=vals.map(([label,d,t])=>`<div class="stat-card"><span>${label}</span><strong>${d}/${t}</strong><small>${t?Math.round(d/t*100):0}% 完成</small></div>`).join('');
}
function currentWeek(){
  const enriched=PLAN.map(w=>({...w,doneCount:w.songs.filter(s=>done(s.sheet)).length}));
  return enriched.find(w=>w.doneCount<w.songs.length)||enriched[enriched.length-1];
}
function currentWeekNumber(){return currentWeek().week||1;}
function lastCheckDays(){
  const dates=Object.values(state||{}).map(item=>typeof item==='object'&&item?.completedAt?new Date(item.completedAt):null).filter(Boolean).sort((a,b)=>b-a);
  if(!dates.length)return null;
  return Math.floor((Date.now()-dates[0].getTime())/86400000);
}
function drawStreak(){
  const days=lastCheckDays(), target=$('streakNotice');
  if(!days||days<2){target.classList.add('hidden');return;}
  target.innerHTML=`⏰ 你已经 <strong>${days} 天</strong>没打卡了，今天只做 1 首歌也行哦～`;
  target.classList.remove('hidden');
}
function celebrate(barId){
  const feedback=$('todayFeedback');feedback.classList.remove('show');void feedback.offsetWidth;feedback.classList.add('show');
  setTimeout(()=>feedback.classList.remove('show'),700);
  const bar=$(barId);if(bar){bar.classList.remove('jump');void bar.offsetWidth;bar.classList.add('jump');}
}
function drawToday(){
  const week=currentWeek();
  const sheets=PLAN.flatMap(w=>w.songs.map(s=>s.sheet)), ds=sheets.filter(done).length;
  const card=(title,sub,items,render)=>items.length?`<section class="today-card"><div class="today-card-head"><h3>${title}</h3><small>${sub}</small></div><div class="today-card-body">${items.map(render).join('')}</div></section>`:'';
  const heroes=week.songs.map((song,index)=>{
    const info=bySheet.get(song.sheet), allDone=done(song.sheet), tpr=(info?.tpr||[]).filter(t=>t.lyric);
    return `<article class="today-hero" data-hero-index="${index}"><div class="today-kicker"><span>${esc(song.label||week.label)} · ${esc(song.theme||week.theme)}</span><span>${esc(song.category||week.category)}</span></div><h2>${esc(song.title)}</h2><p>${esc(info?.meta||'')}</p><div class="today-actions">${badge(status(song.sheet))}<button class="toggle ${allDone?'is-done':''}" type="button" data-toggle="${esc(song.sheet)}">${allDone?'取消打卡':'标记完成'}</button></div></article>`;
  }).join('');
  const dots=week.songs.map((song,index)=>`<button class="today-dot ${index===0?'active':''}" type="button" data-dot="${index}" aria-label="切换到第 ${index+1} 首儿歌"></button>`).join('');
  $('todayList').innerHTML=`<div class="today-track">${heroes}</div><div class="today-dots">${dots}</div><div id="todayDetails"></div>`;
  const track=$('todayList').querySelector('.today-track');
  const details=$('todayDetails');
  const renderDetails=(index)=>{
    const song=week.songs[index], info=bySheet.get(song.sheet);
    const relevantPattern=(songObj,p)=>{
      if(p.type!=='形容词卡')return true;
      const lyric=norm((songObj.lyrics||[]).join(' ')), pattern=norm(p.pattern);
      return pattern.split(/\s+/).some(w=>w.length>2&&lyric.includes(w));
    };
    const patterns=(info?.patterns||[]).filter(p=>relevantPattern(info,p));
    details.innerHTML=card('儿歌','完整歌词',info?.lyrics||[],(line,i)=>`<div class="lyric"><b>${i+1}</b><span>${esc(line)}</span></div>`)+card('名词','核心词汇',info?.words||[],(w,i)=>`<div class="word"><b>${i+1}</b><div class="word-top"><strong>${esc(w.english)}</strong><small>${esc(w.ipa)}</small><em>${esc(w.meaning)}</em></div></div>`)+card('TPR','动作指令',(info?.tpr||[]).filter(t=>t.lyric),(t,i)=>`<div class="tpr"><small>${i+1}</small><div><p>${esc(t.lyric)}</p><em>${esc(t.translation)}</em></div></div>`)+card('句型','匹配基础句型',patterns,p=>{const number=popNum(p);return `<div class="qa"><small>${esc(p.type)} ${number?number+'.':''}</small><p>${esc(p.pattern)}</p>${transHTML(p)}</div>`;});
  };
  track.addEventListener('scroll',()=>{
    const index=Math.min(week.songs.length-1,Math.max(0,Math.round(track.scrollLeft/track.clientWidth)));
    $('todayList').querySelectorAll('.today-dot').forEach((dot,i)=>dot.classList.toggle('active',i===index));
    renderDetails(index);
  },{passive:true});
  $('todayList').querySelectorAll('[data-dot]').forEach(dot=>dot.addEventListener('click',()=>{
    track.scrollTo({left:Number(dot.dataset.dot)*track.clientWidth,behavior:'smooth'});
  }));
  renderDetails(0);
}
function drawTop(){const sheets=PLAN.flatMap(w=>w.songs.map(s=>s.sheet)),d=sheets.filter(done).length;$('songStat').textContent=`已完成 ${d}/${sheets.length} 首`;$('stickWeek').textContent=`坚持第 ${currentWeekNumber()} 周`;$('rateStat').textContent=`${sheets.length?Math.round(d/sheets.length*100):0}%`;$('progressBar').style.width=`${sheets.length?d/sheets.length*100:0}%`;}

function printHTML(title,subtitle,body,landscape=false){
  const width=landscape?1123:794, height=landscape?794:1123;
  $('printArea').innerHTML=`<div style="width:${width}px;height:${height}px;padding:54px 46px;box-sizing:border-box;background:#fff;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:#111;"><div class="print-page-title">${title}</div><p class="print-subtitle">${subtitle}</p>${body}</div>`;

}
function printSheet(kind){

    const cells=PLAN.map(w=>{const n=w.songs.filter(s=>done(s.sheet)).length;return `<div class="print-cell ${n===w.songs.length?'done':''}">${w.week}</div>`}).join('');

  }
  if(kind==='theme'){
    const info=bySheet.get(week.songs[0].sheet), verbs=(week.songs.flatMap(s=>bySheet.get(s.sheet)?.words||[]).slice(0,6).map(w=>w.english));

  }
}

async function makePdf(kind){
  const overlay=$('pdfOverlay'); overlay.classList.add('show');
  $('pdfTitle').textContent='正在生成 PDF';
  $('pdfStatus').textContent='正在按 A4 排版生成，请稍候。';
  $('pdfOpen').disabled=$('pdfShare').disabled=true;
  try{
    const week=currentWeek(), doneCount=PLAN.flatMap(w=>w.songs).filter(s=>done(s.sheet)).length;
    let title='',subtitle='',body='',landscape=false;
    if(kind==='wall'){title='33周打卡墙';subtitle=`每周 3 首 · 已完成 ${doneCount}/99 首`;landscape=true;const cells=PLAN.map(w=>{const n=w.songs.filter(s=>done(s.sheet)).length;return `<div class="print-cell ${n===w.songs.length?'done':''}">${w.week}</div>`}).join('');body=`<div class="print-grid">${cells}</div>`}
    if(kind==='theme'){title=`第 ${week.week} 周 · ${week.theme} 主题卡`;subtitle=week.category;const words=week.songs.flatMap(s=>bySheet.get(s.sheet)?.words||[]).slice(0,8);body=`<div class="print-theme"><h2>本周 3 首儿歌</h2><ul>${week.songs.map(s=>`<li>${esc(s.title)}</li>`).join('')}</ul></div><div class="print-theme"><h2>本周核心词汇</h2><ul>${words.map(w=>`<li>${esc(w.english)} · ${esc(w.meaning)}</li>`).join('')}</ul></div><div class="print-theme"><h2>本周亲子口语 3 句</h2><ul><li>Let's listen to this song!</li><li>Can you do it with me?</li><li>Great job! You did it!</li></ul></div>`}
    if(kind==='plan'){title='33周SSS儿歌计划表';subtitle=`共 33 周 · 99 首 · 已完成 ${doneCount}/99 首`;const rows=PLAN.map(w=>`<tr><td>${w.week}</td><td>${esc(w.theme)}</td><td>${esc(w.category)}</td><td><ul style="margin:0;padding-left:16px">${w.songs.map(s=>`<li>${esc(s.title)}</li>`).join('')}</ul></td><td>${w.songs.filter(s=>done(s.sheet)).length}/3</td></tr>`).join('');body=`<table class="print-table"><thead><tr><th>周</th><th>主题</th><th>分类</th><th>儿歌</th><th>进度</th></tr></thead><tbody>${rows}</tbody></table>`}
    const canvas=await printHTML(title,subtitle,body,landscape);
    const pdf=new window.jspdf.jsPDF({orientation:landscape?'landscape':'portrait',unit:'mm',format:'a4',compress:true});
    const pw=landscape?297:210, ph=landscape?210:297, iw=pw-16, ih=canvas.height*iw/canvas.width, ihFinal=Math.min(ih,ph-16);
    pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',8,8,iw,ihFinal,undefined,'FAST');
    const blob=pdf.output('blob');
    if(lastPdf.url)URL.revokeObjectURL(lastPdf.url);
    lastPdf={blob,url:URL.createObjectURL(blob),name:`${title}.pdf`};
    $('pdfTitle').textContent=title;
    $('pdfStatus').textContent='PDF 已生成。可以打开后保存到文件、打印或分享。';
    $('pdfOpen').disabled=$('pdfShare').disabled=false;
  }catch(error){
    $('pdfStatus').textContent='生成失败：请刷新页面后重试。';
  }
}
function openSong(sheet){
  const s=bySheet.get(sheet); if(!s)return;
  const code=thumb(s.videoUrl), cover=code?`https://i.ytimg.com/vi/${code}/hqdefault.jpg`:'';
  const wordCard=(w)=>{
    return `<div class="word-card"><strong>${esc(w.english)}</strong><small>${esc(w.ipa)}</small><em>${esc(w.meaning)}</em></div>`;
  };
  const patternCard=(p)=>{
    const number=popNum(p), lib=(window.SSS_PATTERN_LIBRARY||[]).find(row=>row.type===p.type&&row.number===number);
    const examples=(lib?.example||'').split(/\r?\n/).filter(Boolean).map(x=>esc(x));
    const actionWord=(s.words||[]).find(w=>['clap','stomp','turn around'].includes(String(w.english).toLowerCase()))?.english||'clap';
    const body=p.type==='动词卡'&&number===12?[
      ['Q','Can I '+((s.words||[])[2]?.english||'clap')+' now?'],
      ['A','Yes, you can '+((s.words||[])[2]?.english||'clap')+' now.'],
    ]:p.type==='动词卡'&&number===57?[
      ['Q','What is it doing?'],
      ['A','It is '+toIng((s.words||[])[2]?.english||'clap')+' around the flowers.'],
    ]:[];
    const swaps=number===12?['clap now?','stretch up high?','touch your toes?','turn around?','say hello?']:number===57?['It is clapping around the flowers.','It is stomping around the flowers.','It is turning around the flowers.']:[];
    const swapZh=number===12?'我现在可以拍手吗？ / 我可以伸高吗？ / 我可以摸脚趾吗？ / 我可以转圈吗？ / 我可以说 Hello 吗？':'它在花丛边拍手。 / 它在花丛边跺脚。 / 它在花丛边转圈。';
    const exampleZh=number===12?'如果你想去睡觉，你会怎么问？我现在可以睡觉吗？':number===57?'看，这里有美丽的花。在花丛边你能做什么？ / 熊猫在花丛边做什么？ / 熊猫在花丛边跳舞。':'';
    const zhFor={12:'我可以……吗？ / 是的，你可以。',57:'它在做什么？ / 它正在……花丛边。'};
    return `<div class="qa"><small>${esc(p.type)} ${number?number+'.':''}</small><p>${esc(p.pattern)}</p>${zhFor[number]?`<div class="trans">${esc(zhFor[number])}</div>`:''}${body.length?`<ul class="qa-examples">${body.map(([k,v])=>`<li><b>${k}:</b> ${esc(v)}</li>`).join('')}</ul>`:''}${swaps.length?`<ul class="qa-examples"><li><b>替换词：</b>${swaps.map(esc).join(' / ')}<br><span style="color:#67797c">${esc(swapZh)}</span></li></ul>`:''}${examples.length?`<ul class="qa-examples">${examples.map(x=>`<li>${x}</li>`).join('')}${exampleZh?`<li><span style="color:#67797c">${esc(exampleZh)}</span></li>`:''}</ul>`:''}</div>`;
  };
  const tprRows=(s.tpr||[]).filter(t=>t.lyric);
  const transHTML=(p)=>{
    const number=popNum(p), lib=(window.SSS_PATTERN_LIBRARY||[]).find(row=>row.type===p.type&&row.number===number);
    const examples=(lib?.example||'').split(/\r?\n/).filter(Boolean);
    const actionWord=(s.words||[]).find(w=>['clap','stomp','turn around'].includes(String(w.english).toLowerCase()))?.english||'clap';
    const body=p.type==='动词卡'&&number===12?[
      ['Q','Can I '+actionWord+' now?'],
      ['A','Yes, you can '+actionWord+' now.'],
    ]:p.type==='动词卡'&&number===57?[
      ['Q','What is it doing?'],
      ['A','It is '+toIng(actionWord)+' around the flowers.'],
    ]:[];
    const swaps=number===12?['clap now?','stretch up high?','touch your toes?','turn around?','say hello?']:number===57?['It is clapping around the flowers.','It is stomping around the flowers.','It is turning around the flowers.']:[];
    const swapZh=number===12?'我现在可以拍手吗？ / 我可以伸高吗？ / 我可以摸脚趾吗？ / 我可以转圈吗？ / 我可以说 Hello 吗？':'它在花丛边拍手。 / 它在花丛边跺脚。 / 它在花丛边转圈。';
    const exampleZh=number===12?'如果你想去睡觉，你会怎么问？我现在可以睡觉吗？':number===57?'看，这里有美丽的花。在花丛边你能做什么？ / 熊猫在花丛边做什么？ / 熊猫在花丛边跳舞。':'';
    const zhFor={12:'我可以……吗？ / 是的，你可以。',57:'它在做什么？ / 它正在……花丛边。'};
    return `${zhFor[number]?`<div class="trans">${esc(zhFor[number])}</div>`:''}${body.length?`<ul class="qa-examples">${body.map(([k,v])=>`<li><b>${k}:</b> ${esc(v)}</li>`).join('')}</ul>`:''}${swaps.length?`<ul class="qa-examples"><li><b>替换词：</b>${swaps.map(esc).join(' / ')}<br><span style="color:#67797c">${esc(swapZh)}</span></li></ul>`:''}${examples.length?`<ul class="qa-examples">${examples.map(x=>`<li>${x}</li>`).join('')}${exampleZh?`<li><span style="color:#67797c">${esc(exampleZh)}</span></li>`:''}</ul>`:''}`;
  };
  const tprAction=(lyric)=>{
    const text=String(lyric||'');
    const actions=['clap your hands','stretch up high','touch your toes','turn around','say "Hello"','say hello'];
    const hit=actions.find(a=>text.toLowerCase().includes(a));
    if(!hit)return esc(text);
    const i=text.toLowerCase().indexOf(hit);
    return `${esc(text.slice(0,i))}<span class="tpr-action">${esc(text.slice(i,i+hit.length))}</span>${esc(text.slice(i+hit.length))}`;
  };
  $('songRoot').innerHTML=`<div class="detail-bar"><button class="back" type="button" data-back>← 返回</button><div class="detail-actions">${badge(status(sheet))}<button class="toggle ${done(sheet)?'is-done':''}" type="button" data-toggle="${esc(sheet)}">${status(sheet)==='已完成'?'取消打卡':'标记完成'}</button></div></div><div class="detail-head"><small>第 ${s.week||'--'} 周 · ${esc(s.theme||'')}</small><h2>${esc(s.title)}</h2><p>${esc(s.category||'')} · ${esc(s.meta||'')}</p></div><div class="facts"><div><span>词汇</span><strong>${s.words?.length||0}</strong></div><div><span>TPR</span><strong>${tprRows.length}</strong></div><div><span>句型</span><strong>${s.patterns?.length||0}</strong></div><div><span>歌词</span><strong>${s.lyrics?.length||0}</strong></div></div><section class="section"><div class="section-head"><h3>完整歌词</h3><small>${s.lyrics?.length||0} 行</small></div><div class="section-body">${(s.lyrics||[]).map((l,i)=>`<div class="lyric"><b>${i+1}</b><span>${esc(l)}</span></div>`).join('')||'<div class="empty">暂无歌词</div>'}</div></section><section class="section"><div class="section-head"><h3>核心词汇</h3><small>${s.words?.length||0} 个</small></div><div class="word-grid">${(s.words||[]).map(wordCard).join('')||'<div class="empty">暂无词汇</div>'}</div></section><section class="section"><div class="section-head"><h3>TPR动作</h3><small>${tprRows.length} 条</small></div><div class="section-body">${tprRows.map((t,i)=>`<div class="tpr-row"><b>${i+1}</b><span><strong>${tprAction(t.lyric)}</strong><div class="meaning">${esc(t.translation)}</div></span></div>`).join('')||'<div class="empty">暂无TPR动作</div>'}</div></section><section class="section"><div class="section-head"><h3>匹配句型</h3><small>${s.patterns?.length||0} 条</small></div><div class="section-body">${(s.patterns||[]).map(patternCard).join('')||'<div class="empty">暂无句型</div>'}</div></section><div style="height:84px"></div>`;
  $('listRoot').classList.add('hidden'); $('statsRoot').classList.add('hidden'); $('songRoot').classList.remove('hidden'); $('songRoot').classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view==='songRoot')); window.scrollTo({top:0});
}
function show(view){ document.querySelectorAll('.main').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.main').forEach(x=>x.classList.add('hidden')); const target=$(view); target.classList.remove('hidden'); target.classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view)); if(view!=='songRoot'){if(view==='listRoot')drawList();if(view==='statsRoot')drawStats();} window.scrollTo({top:0}); }
$('search').addEventListener('input',e=>{q=e.target.value;drawList()});
$('chips').addEventListener('click',e=>{
  const statusChip=e.target.closest('[data-status]');
  if(statusChip){statusFilter=statusChip.dataset.status;drawChips();drawList();return;}
  const b=e.target.closest('[data-cat]');if(!b)return;chip=b.dataset.cat;drawChips();drawList();
});
document.body.addEventListener('click',e=>{
  const open=e.target.closest('[data-open]'); if(open)return openSong(open.dataset.open);
  const toggle=e.target.closest('[data-toggle]'); if(toggle){
    const sheet=toggle.dataset.toggle, completing=!done(sheet);
    state[sheet]=completing?{status:'已完成',completedAt:new Date().toISOString()}:{status:'待打卡',completedAt:''};save();renderAll();drawStreak();
    if(completing)celebrate('progressBar');
    if(!$('songRoot').classList.contains('hidden'))openSong(sheet);
    return;
  }
  const tab=e.target.closest('.tab'); if(tab)return show(tab.dataset.view);
  const printButton=e.target.closest('[data-print]'); if(printButton)return makePdf(printButton.dataset.print);
  if(e.target.closest('#pdfOpen')){if(lastPdf.url){const a=document.createElement('a');a.href=lastPdf.url;a.download=lastPdf.name;a.click();}return;}
  if(e.target.closest('#pdfShare')){if(lastPdf.blob&&navigator.share){navigator.share({files:[new File([lastPdf.blob],lastPdf.name,{type:'application/pdf'})],title:lastPdf.name}).catch(()=>{});}else if(lastPdf.url){window.open(lastPdf.url,'_blank');}return;}
  if(e.target.closest('#pdfClose')){$('pdfOverlay').classList.remove('show');return;}
  if(e.target.closest('[data-back]'))return show('listRoot');
});
drawChips();renderAll();drawStreak();show('todayRoot');
