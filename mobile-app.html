<style>
:root{--ink:#172e32;--muted:#67797c;--brand:#176b70;--deep:#104e53;--soft:#e8f3f2;--yellow:#f5c451;--line:#dce6e5;--canvas:#f3f6f5;--green:#23775c;}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100dvh;background:#fff;box-shadow:0 0 32px rgba(20,50,52,.08)}

.mstat span,.mstat strong{display:block}.mstat span{color:#c9e3e1;font-size:10px}.mstat strong{margin-top:2px;font-size:17px}

.content{padding:4px 16px 90px}

<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='sss-33-week-progress-v1'; let state; try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'');
const status=sheet=>{const s=state[sheet];return(typeof s==='object'&&s?s.status:s)==='已完成'?'已完成':'待打卡'};
const done=sheet=>status(sheet)==='已完成';
const badge=s=>`<span class="mini-status ${s==='已完成'?'done':''}">${s}</span>`;
const source=JSON.parse($('week-data').textContent);
const PLAN=source.weeks,CATS=source.categories,songs=window.SSS_WEB_DATA.songs,bySheet=new Map(songs.map(x=>[x.sheet,x]));
$('week-data').textContent='';
const popNum=p=>Number(String(p.pattern||'').match(/(\d+)\s*\./)?.[1]);
const allPatternIds=songs.flatMap(s=>(s.patterns||[]).map(p=>{const n=popNum(p);return n?`${p.type}#${n}`:''})).filter(Boolean);
const cardNums=type=>new Set(songs.flatMap(s=>(s.patterns||[]).filter(p=>p.type===type).map(popNum).filter(Boolean)));
const totals={nouns:cardNums('名词卡').size,verbs:cardNums('动词卡').size,patterns:new Set(allPatternIds).size,tpr:songs.reduce((n,s)=>n+(s.tpr?.length||0),0)};
const thumb=url=>String(url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/)?.[1];
let chip='',q='';
function drawChips(){ $('chips').innerHTML=`<button class="chip ${!chip?'active':''}" data-cat="">全部</button>`+CATS.map(c=>`<button class="chip ${chip===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');}
function drawList(){
  const list=PLAN.map(w=>({...w,visible:w.songs.map(s=>(!q||norm(s.title+w.theme+w.category).includes(norm(q)))&&(!chip||w.category===chip))})).filter(w=>w.visible.some(Boolean));
  const count=list.reduce((n,w)=>n+w.visible.filter(Boolean).length,0);
  $('note').textContent=`${list.length} 个周计划 · ${count} 首儿歌`;
  $('weeks').innerHTML=list.length?list.map(w=>{
    const d=w.songs.filter(s=>done(s.sheet)).length, all=d===w.songs.length;
    return `<article class="week-card ${all?'done':''}"><div class="week-top"><div><div class="week-title">${esc(w.label)} · ${esc(w.theme)}</div><div class="week-theme">${esc(w.category)}</div></div><span class="week-badge">${d}/${w.songs.length}</span></div>${w.songs.map((s,i)=>{if(!w.visible[i])return '';const st=status(s.sheet),info=bySheet.get(s.sheet),words=info?.words?.length||0,code=thumb(info?.videoUrl);return `<div class="song-row"><button class="song-name" type="button" data-open="${esc(s.sheet)}">${esc(s.title)}<div class="song-sub">${words} 个核心词汇 ${code?'· 有封面':''}</div></button><div style="display:flex;align-items:center;gap:6px">${badge(st)}<button class="toggle ${st==='已完成'?'is-done':''}" type="button" data-toggle="${esc(s.sheet)}">${st==='已完成'?'取消':'完成'}</button></div></div>`}).join('')}</article>`;
  }).join(''):'<div class="empty">没有匹配的儿歌</div>';
}
function drawStats(){
  const sheets=PLAN.flatMap(w=>w.songs.map(s=>s.sheet)), ds=new Set(sheets.filter(done)), dsongs=songs.filter(s=>ds.has(s.sheet));
  const nouns=new Set(),verbs=new Set(),pats=new Set();
  dsongs.forEach(s=>(s.patterns||[]).forEach(p=>{const n=popNum(p);if(!n)return;if(p.type==='名词卡')nouns.add(n);if(p.type==='动词卡')verbs.add(n);pats.add(`${p.type}#${n}`)}));
  const vals=[['名词',nouns.size,totals.nouns],['动词',verbs.size,totals.verbs],['核心句型',pats.size,totals.patterns],['TPR指令',dsongs.reduce((n,s)=>n+(s.tpr?.length||0),0),totals.tpr]];
  $('resourceStats').innerHTML=vals.map(([label,d,t])=>`<div class="stat-card"><span>${label}</span><strong>${d}/${t}</strong><small>${t?Math.round(d/t*100):0}% 完成</small></div>`).join('');
}
function currentWeek(){
  const enriched=PLAN.map(w=>({...w,doneCount:w.songs.filter(s=>done(s.sheet)).length}));
  return enriched.find(w=>w.doneCount<w.songs.length)||enriched[enriched.length-1];
}
function drawToday(){
  const week=currentWeek();
  $('todayStat').textContent=`${week.doneCount}/${week.songs.length}`;
  $('todayWeek').textContent=week.week||'--';
  const sheets=PLAN.flatMap(w=>w.songs.map(s=>s.sheet)), ds=sheets.filter(done).length;
  $('todayTotal').textContent=`${sheets.length?Math.round(ds/sheets.length*100):0}%`;
  $('todayBar').style.width=`${sheets.length?ds/sheets.length*100:0}%`;
  const card=(title,sub,items,render)=>items.length?`<section class="today-card"><div class="today-card-head"><h3>${title}</h3><small>${sub}</small></div><div class="today-card-body">${items.map(render).join('')}</div></section>`:'';
  const heroes=week.songs.map((song,index)=>{
    const info=bySheet.get(song.sheet), allDone=done(song.sheet), tpr=(info?.tpr||[]).filter(t=>t.lyric);
    return `<article class="today-hero" data-hero-index="${index}"><div class="today-kicker"><span>${esc(song.label||week.label)} · ${esc(song.theme||week.theme)}</span><span>${esc(song.category||week.category)}</span></div><h2>${esc(song.title)}</h2><p>${esc(info?.meta||'')}</p><div class="today-actions">${badge(status(song.sheet))}<button class="toggle ${allDone?'is-done':''}" type="button" data-toggle="${esc(song.sheet)}">${allDone?'取消打卡':'标记完成'}</button><button class="toggle" type="button" data-open="${esc(song.sheet)}">查看全部</button></div></article>`;
  }).join('');
  const dots=week.songs.map((song,index)=>`<button class="today-dot ${index===0?'active':''}" type="button" data-dot="${index}" aria-label="切换到第 ${index+1} 首儿歌"></button>`).join('');
  const first=bySheet.get(week.songs[0].sheet);
  $('todayList').innerHTML=`<div class="today-track">${heroes}</div><div class="today-dots">${dots}</div>${card('儿歌','完整歌词',first?.lyrics||[],(line,i)=>`<div class="lyric"><b>${i+1}</b><span>${esc(line)}</span></div>`)}${card('名词','核心词汇',first?.words||[],w=>`<div class="word"><div class="word-top"><strong>${esc(w.english)}</strong><small>${esc(w.ipa)}</small></div><div class="meaning">${esc(w.meaning)}</div></div>`)}${card('TPR','动作指令',(first?.tpr||[]).filter(t=>t.lyric),t=>`<div class="tpr"><small>${esc(t.step)}</small><p>${esc(t.lyric)}</p><em>${esc(t.translation)}</em></div>`)}${card('句型','匹配基础句型',first?.patterns||[],p=>`<div class="qa"><small>${esc(p.type)}</small><p>${esc(p.pattern)}</p></div>`)}`;
  const track=$('todayList').querySelector('.today-track');
  track.addEventListener('scroll',()=>{
    const index=Math.round(track.scrollLeft/track.clientWidth);
    $('todayList').querySelectorAll('.today-dot').forEach((dot,i)=>dot.classList.toggle('active',i===index));
  },{passive:true});
  $('todayList').querySelectorAll('[data-dot]').forEach(dot=>dot.addEventListener('click',()=>{
    track.scrollTo({left:Number(dot.dataset.dot)*track.clientWidth,behavior:'smooth'});
  }));
}
function drawTop(){const sheets=PLAN.flatMap(w=>w.songs.map(s=>s.sheet)),d=sheets.filter(done).length;$('songStat').textContent=`${d}/${sheets.length}`;$('rateStat').textContent=`${sheets.length?Math.round(d/sheets.length*100):0}%`;$('progressBar').style.width=`${sheets.length?d/sheets.length*100:0}%`;}
function renderAll(){drawToday();drawTop();drawList();drawStats();}
function openSong(sheet){
  const s=bySheet.get(sheet); if(!s)return;
  const code=thumb(s.videoUrl), cover=code?`https://i.ytimg.com/vi/${code}/hqdefault.jpg`:'';
  $('songRoot').innerHTML=`<div class="detail-bar"><button class="back" type="button" data-back>← 返回</button><div class="detail-actions">${badge(status(sheet))}<button class="toggle ${done(sheet)?'is-done':''}" type="button" data-toggle="${esc(sheet)}">${status(sheet)==='已完成'?'取消打卡':'标记完成'}</button></div></div><div class="detail-head"><small>第 ${s.week||'--'} 周 · ${esc(s.theme||'')}</small><h2>${esc(s.title)}</h2><p>${esc(s.category||'')} · ${esc(s.meta||'')}</p></div><div class="facts"><div><span>词汇</span><strong>${s.words?.length||0}</strong></div><div><span>TPR</span><strong>${s.tpr?.length||0}</strong></div><div><span>句型</span><strong>${s.patterns?.length||0}</strong></div><div><span>歌词</span><strong>${s.lyrics?.length||0}</strong></div></div>${cover?`<div style="height:190px;background:url('${cover}') center/cover"></div>`:''}<section class="section"><div class="section-head"><h3>核心词汇</h3><small>${s.words?.length||0} 个</small></div><div class="section-body">${(s.words||[]).map(w=>`<div class="word"><div class="word-top"><strong>${esc(w.english)}</strong><small>${esc(w.ipa)}</small></div><div class="meaning">${esc(w.meaning)}</div></div>`).join('')||'<div class="empty">暂无</div>'}</div></section><section class="section"><div class="section-head"><h3>TPR指令</h3><small>${s.tpr?.length||0} 条</small></div><div class="section-body">${(s.tpr||[]).map(t=>`<div class="tpr"><small>${esc(t.step)}</small><p>${esc(t.lyric)}</p><em>${esc(t.translation)}</em></div>`).join('')||'<div class="empty">暂无</div>'}</div></section><section class="section"><div class="section-head"><h3>匹配句型</h3><small>${s.patterns?.length||0} 条</small></div><div class="section-body">${(s.patterns||[]).map(p=>`<div class="qa"><small>${esc(p.type)}</small><p>${esc(p.pattern)}</p></div>`).join('')||'<div class="empty">暂无</div>'}</div></section><section class="section"><div class="section-head"><h3>完整歌词</h3><small>${s.lyrics?.length||0} 行</small></div><div class="section-body">${(s.lyrics||[]).map((l,i)=>`<div class="lyric"><b>${i+1}</b><span>${esc(l)}</span></div>`).join('')||'<div class="empty">暂无</div>'}</div></section><div style="height:84px"></div>`;
  $('listRoot').classList.add('hidden'); $('statsRoot').classList.add('hidden'); $('songRoot').classList.remove('hidden'); $('songRoot').classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view==='songRoot')); window.scrollTo({top:0});
}
function show(view){ document.querySelectorAll('.main').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.main').forEach(x=>x.classList.add('hidden')); const target=$(view); target.classList.remove('hidden'); target.classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view)); if(view!=='songRoot'){if(view==='listRoot')drawList();if(view==='statsRoot')drawStats();} window.scrollTo({top:0}); }
$('search').addEventListener('input',e=>{q=e.target.value;drawList()});
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;chip=b.dataset.cat;drawChips();drawList()});
document.body.addEventListener('click',e=>{
  const open=e.target.closest('[data-open]'); if(open)return openSong(open.dataset.open);
  const toggle=e.target.closest('[data-toggle]'); if(toggle){const sheet=toggle.dataset.toggle;state[sheet]=!done(sheet)?{status:'已完成',completedAt:new Date().toISOString()}:{status:'待打卡',completedAt:''};save();renderAll();if(!$('songRoot').classList.contains('hidden'))openSong(sheet);return;}
  const tab=e.target.closest('.tab'); if(tab)return show(tab.dataset.view);
  if(e.target.closest('[data-back]'))return show('listRoot');
});
drawChips();renderAll();show('todayRoot');
</script>
</body>
</html>
