.week-cell:last-child { border-right: 0; }
.week-label strong { font-size: 15px; }
.week-sub { margin-top: 5px; color: var(--muted); font-size: 11px; }

.song-hero-content { position: relative; z-index: 1; max-width: 780px; }
.song-kicker { margin: 0 0 8px; color: #bfe2df; font-size: 13px; font-weight: 700; }
.song-hero h1 { margin: 0; font-size: 34px; }
.song-hero p { color: #d9ecea; line-height: 1.55; }

          52: [`Is ${doing} good for you?`, `Yes, ${doing} is good for me.`, `${word.meaning}对你有好处吗？有。`],
          54: ["What's it doing?", `It is ${doing} on the desk.`, `它在做什么？它在桌上${word.meaning}。`],
          55: ["What's it doing?", `It is ${doing} under the table.`, `它在做什么？它在桌子下${word.meaning}。`],
          56: ["What's it doing?", `It is ${doing} on the grass.`, `它在做什么？它在草地上${word.meaning}。`],
          57: ["What's it doing?", `It is ${doing}${doing.endsWith(" around") ? "" : " around"} the flowers.`, `它在做什么？它在花丛边${word.meaning}。`],
          58: ["What's it doing?", `It is ${doing} on the sofa.`, `它在做什么？它在沙发上${word.meaning}。`],
          59: ["What's it doing?", `It is ${doing} on the bus.`, `它在做什么？它在公交车上${word.meaning}。`],
          61: ["What are they doing?", `They are ${doing} on the bed.`, `它们在做什么？它们在床上${word.meaning}。`],
          62: ["What's it doing?", `It is ${doing} in the building.`, `它在做什么？它在楼里${word.meaning}。`],
          63: ["What's it doing?", `It is ${doing} through the window.`, `它在做什么？它在窗边${word.meaning}。`],
          64: ["What's it doing?", `It is ${doing} behind the door.`, `它在做什么？它在门后${word.meaning}。`],
          65: ["What's it doing?", `It is ${doing} on the boat.`, `它在做什么？它在船上${word.meaning}。`],
          66: ["What's it doing?", `It is ${doing} in the sea.`, `它在做什么？它在海里${word.meaning}。`],
          67: [`What can you do?`, `I can ${value} under the sun.`, `你能做什么？我能在太阳下${word.meaning}。`],
          68: ["What are they doing?", `They are ${doing} on the moon.`, `它们在做什么？它们在月亮上${word.meaning}。`],
        };
        if (verbMap[number]) { const [q, a, t] = verbMap[number]; rows.push(item(pattern, word, q, a, t)); }
        return;
      }
      const genericAdjMap = {
        1: ["What's it like?", `It's ${value}.`, `它是什么样的？它是${word.meaning.replace(/的$/, "")}的。`],
        3: ["What does your dad have?", `My dad has ${article(value)} ${value}.`, `爸爸有什么？爸爸有一个${word.meaning}。`],
        4: ["What do you like?", `I like ${obj}.`, `你喜欢什么？我喜欢${word.meaning}。`],
        9: ["What should we do?", `Be careful with the ${value}!`, `我们该注意什么？小心${word.meaning}！`],
        39: ["Which one is longer?", `The ${value} is longer.`, `哪个更长？${word.meaning}更长。`],
        41: ["How is the food?", `The ${value} is yummy.`, `食物怎么样？这个${word.meaning}很好吃。`],
        42: ["How is the food?", `The ${value} is yucky.`, `食物怎么样？这个${word.meaning}不好吃。`],
        53: ["What's full?", `The ${value} is full.`, `什么满了？${word.meaning}满了。`],
        57: ["Where can we go?", `We can go to the ${value}.`, `我们可以去哪里？我们可以去${word.meaning}。`],
        69: [`Is it about ${value}?`, `Yes, it depends on the ${value}.`, `这和${word.meaning}有关吗？是的，要看${word.meaning}。`],
        99: ["What do they like to eat?", `They like to eat ${value}.`, `它们喜欢吃什么？它们喜欢吃${word.meaning}。`],
      };
      if (pattern.type === "形容词卡" && genericAdjMap[number]) { const [q, a, t] = genericAdjMap[number]; rows.push(item(pattern, word, q, a, t)); return; }
      const adjMap = {
        17: ["How do you feel?", `I feel ${value}.`, `你感觉怎么样？我感到${word.meaning.replace(/的$/, "")}。`],
        23: ["How is it now?", `It is ${value}.`, `它现在怎么样？它是${word.meaning.replace(/的$/, "")}的。`],
        24: ["How are your hands?", `My hands are ${value}.`, `你的手怎么样？我的手很${word.meaning.replace(/的$/, "")}。`],
        47: ["How is your mom?", `My mom is very ${value}.`, `妈妈怎么样？妈妈很${word.meaning.replace(/的$/, "")}。`],
        48: ["What happened?", `I got so ${value}.`, `怎么了？我变得很${word.meaning.replace(/的$/, "")}。`],
        56: [`Can you be ${value}?`, `Yes, I can be ${value}.`, `你能${word.meaning.replace(/的$/, "")}一点吗？可以。`],
        96: ["How does it smell?", `It smells ${value}.`, `它闻起来怎么样？闻起来${word.meaning.replace(/的$/, "")}。`],
      };
      if (pattern.type === "形容词卡" && adjMap[number]) { const [q, a, t] = adjMap[number]; rows.push(item(pattern, word, q, a, t)); }
    });
  });
  return rows.slice(0, 20);
}

function showTemplateNotice() {
  document.querySelector(".page").innerHTML = `
    <section class="hero"><div class="hero-copy">
      <p class="hero-kicker">构建源文件 · 不是成品页</p>
      <h1>这是页面模板，请打开成品文件</h1>
      <p class="hero-desc">正确的成品网页是同一个文件夹里的「33周SSS儿歌计划表.html」，双击即可打开，不需要启动本地服务。</p>
    </div></section>`;
  document.title = "这是模板文件";
}

function renderStats() {
  const done = allSheets.filter(isDone).length;
  $("stat-done").textContent = `${done}/${TOTAL}`;
  $("stat-rate").textContent = `${TOTAL ? Math.round((done / TOTAL) * 100) : 0}%`;
  $("hero-bar").style.width = `${TOTAL ? (done / TOTAL) * 100 : 0}%`;
  const doneSheets = new Set(allSheets.filter(isDone));
  const doneSongs = songs.filter((song) => doneSheets.has(song.sheet));
  const resourceTotals = {
    nouns: TOTAL_NOUNS,
    verbs: TOTAL_VERBS,
    tpr: TOTAL_TPR,
    patterns: TOTAL_PATTERNS,
  };
  const resourceDone = doneSongs.reduce((totals, song) => {
    song.patterns?.forEach((pattern) => {
      if (pattern.type === "名词卡") totals.nouns += 1;
      if (pattern.type === "动词卡") totals.verbs += 1;
    });
    totals.tpr += song.tpr?.length || 0;
    return totals;
  }, { nouns: 0, verbs: 0, tpr: 0, patterns: 0 });
  resourceDone.patterns = resourceDone.nouns + resourceDone.verbs;
  $("stat-nouns").textContent = `${resourceDone.nouns}/${resourceTotals.nouns}`;
  $("stat-verbs").textContent = `${resourceDone.verbs}/${resourceTotals.verbs}`;
  $("stat-tpr").textContent = `${resourceDone.tpr}/${resourceTotals.tpr}`;
  $("stat-patterns").textContent = `${resourceDone.patterns}/${resourceTotals.patterns}`;
}

function draw() {
  const theme = $("week-theme").value;
  const query = $("week-song-search").value;
  const status = $("week-status").value;
  const filtered = DATA.weeks
    .filter((week) => !theme || week.category === theme)
    .map((week) => ({ ...week, visible: week.songs.map((song) => (!query || fuzzyMatch(song.title, query)) && (!status || songStatus(song.sheet) === status)) }))
    .filter((week) => week.visible.some(Boolean));
  const visibleCount = filtered.reduce((sum, week) => sum + week.visible.filter(Boolean).length, 0);
  $("week-result-note").textContent = `显示 ${filtered.length} 个周计划，共 ${visibleCount} 首匹配儿歌`;
  $("week-list").innerHTML = filtered.length ? filtered.map((week) => {
    const done = week.songs.filter((song) => isDone(song.sheet)).length;
    const complete = done === week.songs.length;
    return `<article class="week-row${complete ? " complete" : ""}">
      <div class="week-cell week-label"><strong>${escapeHtml(week.label)}</strong><span class="week-sub">${complete ? "本周已完成" : `${done}/${week.songs.length} 已完成`}</span></div>
      <div class="week-cell theme-label">${escapeHtml(week.category)}</div>
      ${week.songs.map((song, index) => {
        if (!week.visible[index]) return `<div class="week-cell"></div>`;
        const current = songStatus(song.sheet);
        return `<div class="week-cell"><button class="song-button" type="button" data-song-sheet="${escapeHtml(song.sheet)}">${escapeHtml(song.title)}</button><div class="song-meta">${statusBadge(current)}<button class="tiny-action" type="button" data-toggle-sheet="${escapeHtml(song.sheet)}">${current === "已完成" ? "取消" : "完成"}</button></div></div>`;
      }).join("")}
      <div class="week-cell progress-cell"><strong>${done}/${week.songs.length}</strong><span>本周</span></div>
    </article>`;
  }).join("") : `<div class="empty">没有匹配的周计划</div>`;
}

function renderSong(sheet) {
  const song = songBySheet.get(sheet);
  if (!song) return;
  const thumbnail = youtubeThumbnail(song.videoUrl);
  const relatedSongs = songs
    .filter((item) => item.sheet !== song.sheet && themeCategory(item.theme) === themeCategory(song.theme))
    .sort((a, b) => (a.week || 999) - (b.week || 999));
  const practice = songPracticeRows(song);
  const current = songStatus(song.sheet);
  $("song-detail-view").innerHTML = `
    <button class="back-button" type="button" data-back>← 返回计划表</button>
    <section class="song-hero ${thumbnail ? "has-image" : ""}" ${thumbnail ? `style="background-image:url('${escapeHtml(thumbnail)}')"` : ""}>
      <div class="song-hero-content"><p class="song-kicker">${song.week ? `第 ${song.week} 周 · ${escapeHtml(themeCategory(song.theme))}` : escapeHtml(song.category)}</p><h1>${escapeHtml(song.title)}</h1><p>${escapeHtml(song.meta)}</p><div class="hero-actions"><button class="button" type="button" data-toggle-sheet="${escapeHtml(song.sheet)}">${current === "已完成" ? "标记为待打卡" : "标记为已完成"}</button></div></div>
    </section>
    <section class="song-facts" aria-label="歌曲基础信息"><div><span>内容类型</span><strong>SSS儿歌</strong></div><div><span>主题</span><strong>${escapeHtml(themeCategory(song.theme))}</strong></div><div><span>学习状态</span><strong>${escapeHtml(current)}</strong></div><div><span>核心词汇</span><strong>${song.words.length} 个</strong></div><div><span>TPR</span><strong>${song.tpr.length} 条</strong></div><div><span>匹配句型</span><strong>${song.patterns.length} 条</strong></div></section>
    <div class="detail-layout"><div class="detail-main">
      <section class="module"><div class="module-head"><h2>完整歌词</h2><span>${song.lyrics.length} 行</span></div>${song.lyrics.length ? `<ol class="lyrics">${song.lyrics.map((line) => `<li>${escapeHtml(line)}</li>`).join("")}</ol>` : `<div class="empty">暂无歌词</div>`}</section>
      <section class="module"><div class="module-head"><h2>核心词汇</h2><span>${song.words.length} 个</span></div>${song.words.length ? `<table class="content-table"><thead><tr><th class="index-column">序号</th><th>英文</th><th>音标</th><th>中文词义</th></tr></thead><tbody>${song.words.map((word, index) => `<tr><td class="index-column">${index + 1}</td><td><strong>${escapeHtml(word.english)}</strong></td><td>${escapeHtml(word.ipa)}</td><td>${escapeHtml(word.meaning)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">暂无核心词汇</div>`}</section>
      <section class="module"><div class="module-head"><h2>TPR</h2><span>歌词原句直接提取</span></div>${song.tpr.length ? `<table class="content-table"><thead><tr><th>步骤</th><th>歌词原句</th><th>中文翻译</th></tr></thead><tbody>${song.tpr.map((item) => `<tr><td>${escapeHtml(item.step)}</td><td>${escapeHtml(item.lyric)}</td><td>${escapeHtml(item.translation)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">歌词中无明确 TPR 动作句</div>`}</section>
      <section class="module"><div class="module-head"><h2>匹配基础句型</h2><span>${song.patterns.length} 条</span></div>${song.patterns.length ? `<table class="content-table"><thead><tr><th>类型</th><th>基础句型</th><th>详细句型</th></tr></thead><tbody>${song.patterns.map((item) => `<tr><td>${escapeHtml(item.type)}</td><td>${escapeHtml(item.pattern)}</td><td class="multiline">${escapeHtml(cleanExample(item.example))}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">暂无匹配句型</div>`}</section>
      ${practice.length ? `<section class="module song-practice-module"><div class="module-head"><h2>句型 × 核心词汇完整问答</h2><span>结合本首歌核心词汇练习</span></div><div class="song-practice-grid">${practice.map((row, index) => `<article class="song-practice-card"><div class="song-practice-head"><span>问答 ${index + 1}</span><small>${escapeHtml(row.type.replace("卡", ""))} · ${escapeHtml(row.word)} <em>${escapeHtml(row.meaning)}</em></small></div><div class="song-practice-pattern">${escapeHtml(row.pattern)}</div><dl><div><dt>Q</dt><dd>${escapeHtml(row.question)}</dd></div><div><dt>A</dt><dd>${escapeHtml(row.answer)}</dd></div></dl><p>${escapeHtml(row.translation)}</p></article>`).join("")}</div></section>` : ""}
    </div></div>
    <section class="related-module"><div class="related-head"><div><h2>相关歌曲</h2></div><span>${relatedSongs.length} 首</span></div>${relatedSongs.length ? `<div class="related-grid">${relatedSongs.map((item) => {
      const cover = youtubeThumbnail(item.videoUrl);
      return `<button class="related-song" type="button" data-song-sheet="${escapeHtml(item.sheet)}"><span class="related-cover ${cover ? "has-cover" : "no-cover"}" ${cover ? `style="background-image:url('${escapeHtml(cover)}')"` : ""}>无封面</span><span class="related-info"><small>第 ${item.week || "--"} 周 · ${escapeHtml(themeCategory(item.theme))}</small><strong>${escapeHtml(item.title)}</strong>${statusBadge(songStatus(item.sheet))}</span></button>`;
    }).join("")}</div>` : `<div class="empty">暂无相关歌曲</div>`}</section>`;
}

function showSong(sheet) {
  renderSong(sheet);
  $("planner-view").setAttribute("class", "planner-view hidden");
  $("week-head").setAttribute("class", "week-head hidden");
  $("week-result-note").setAttribute("class", "result-note hidden");
  document.querySelector(".hero").setAttribute("class", "hero hidden");
  document.querySelector(".filters").setAttribute("class", "filters hidden");
  $("song-detail-view").setAttribute("class", "detail-shell active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showPlanner() {
  $("song-detail-view").setAttribute("class", "detail-shell");
  $("song-detail-view").innerHTML = "";
  $("planner-view").setAttribute("class", "planner-view");
  $("week-head").setAttribute("class", "week-head");
  $("week-result-note").setAttribute("class", "result-note");
  document.querySelector(".hero").setAttribute("class", "hero");
  document.querySelector(".filters").setAttribute("class", "filters");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function initThemeOptions() {
  const select = $("week-theme");
  select.innerHTML = `<option value="">全部主题</option>${DATA.categories.map((category) => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join("")}`;
}

function toggleSong(sheet) {
  const nextDone = !isDone(sheet);
  state[sheet] = nextDone
    ? { status: "已完成", completedAt: new Date().toISOString() }
    : { status: "待打卡", completedAt: "" };
  saveState();
  renderStats();
  draw();
}

$("week-list").addEventListener("click", (event) => {
  const songButton = event.target.closest("[data-song-sheet]");
  if (songButton) {
    showSong(songButton.dataset.songSheet);
    return;
  }
  const button = event.target.closest("[data-toggle-sheet]");
  if (!button) return;
  toggleSong(button.dataset.toggleSheet);
});

$("song-detail-view").addEventListener("click", (event) => {
  if (event.target.closest("[data-back]")) {
    showPlanner();
    return;
  }
  const songButton = event.target.closest("[data-song-sheet]");
  if (songButton) {
    showSong(songButton.dataset.songSheet);
    return;
  }
  const button = event.target.closest("[data-toggle-sheet]");
  if (!button) return;
  toggleSong(button.dataset.toggleSheet);
  renderSong(button.dataset.toggleSheet);
});
["week-theme", "week-song-search", "week-status"].forEach((id) => {
  const field = $(id);
  field.addEventListener("input", draw);
  field.addEventListener("change", draw);
});
$("reset-filters").addEventListener("click", () => {
  $("week-theme").value = "";
  $("week-song-search").value = "";
  $("week-status").value = "";
  draw();
});
window.addEventListener("storage", (event) => {
  if (event.key !== STORAGE_KEY) return;
  state = loadState();
  renderStats();
  draw();
});

$("brand-total").textContent = TOTAL;
$("foot-total").textContent = TOTAL;
if (isTemplateSource) {
  showTemplateNotice();
} else {
  initThemeOptions();
  renderStats();
  draw();
}
</script>
</body>
</html>
